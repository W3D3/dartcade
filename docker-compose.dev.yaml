services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dartgames
      POSTGRES_USER: dartgames
      POSTGRES_PASSWORD: dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartgames"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install --prefer-offline && npm run dev"
    environment:
      DATABASE_URL: postgres://dartgames:dev@postgres:5432/dartgames
      NODE_ENV: development
      PORT: "3000"
      DARTCADE_BOARD_URL: ${DARTCADE_BOARD_URL:-}
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend/frontend:/app
      - /app/node_modules
    command: sh -c "npm install --prefer-offline && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_HOST: backend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # network_mode: host so the bridge can reach your board on the LAN.
  # With host networking the backend is at localhost:3000 (not backend:3000).
  bridge:
    build: ./bridge
    network_mode: host
    environment:
      DARTCADE_BOARD_URL: ${DARTCADE_BOARD_URL:?Set DARTCADE_BOARD_URL to your board's URL, e.g. http://192.168.1.x:3180}
      DARTCADE_BACKEND_URL: ws://localhost:3000/bridge?token=dev-bridge-token
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
