services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dartgames
      POSTGRES_USER: dartgames
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartgames"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install --prefer-offline && npm run dev"
    environment:
      DATABASE_URL: postgres://dartgames:dev@postgres:5432/dartgames
      BRIDGE_SECRET: ${BRIDGE_SECRET:-devsecret}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend/frontend:/app
      - /app/node_modules
    command: sh -c "npm install --prefer-offline && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
