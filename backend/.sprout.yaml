slug: dartcade
preview:
  hostname: 'dartcade-{pr_id}.wedenig.dev'
  app_env:
    BETTER_AUTH_URL: 'https://{hostname}'
    BETTER_AUTH_TRUSTED_ORIGINS: 'https://{hostname}'
    BETTER_AUTH_SECRET:
      generate: stable_per_pr
    BRIDGE_SECRET: preview-only
    PREVIEW_PR: '{pr_id}'
    PREVIEW_PR_URL: 'https://github.com/W3D3/dartcade/pull/{pr_id}'
    NODE_ENV: development
    # Sprout builds the image without build args: the version is stamped at runtime instead
    # ({commit_sha} is GITHUB_SHA, the PR's merge commit that was built); the SPA stays 'dev'
    APP_VERSION: 'pr-{pr_id}'
    APP_COMMIT: '{commit_sha}'
health:
  path: /health
  interval: 2s
  timeout: 120s
  expect: 200
build:
  dockerfile: Dockerfile
seed: {}
