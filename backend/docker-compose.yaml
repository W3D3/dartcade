services:
  backend:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://dartgames:${POSTGRES_PASSWORD}@postgres:5432/dartgames
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      # Unset here (empty string) is read as unset: mail stays off, legal placeholders stay as they are.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-}
      LEGAL_DIR: ${LEGAL_DIR:-}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_UPDATED: ${LEGAL_UPDATED:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dartgames
      POSTGRES_USER: dartgames
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dartgames']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pg_data:
