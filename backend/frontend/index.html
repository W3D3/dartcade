<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dartcade</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f100e" />
    <meta name="apple-mobile-web-app-title" content="Dartcade" />
    <meta
      name="description"
      content="Play custom dart minigames on your Autodarts board: X01, Around the Clock, minigolf and more, solo or with friends."
    />
    <meta property="og:title" content="Dartcade" />
    <meta
      property="og:description"
      content="Play custom dart minigames on your Autodarts board: X01, Around the Clock, minigolf and more, solo or with friends."
    />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <!-- Shown until the app mounts (main.ts removes it); BootLoader.svelte draws the same picture -->
    <div
      id="boot"
      style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #0f100e"
    >
      <style>
        @keyframes boot-pulse {
          50% {
            opacity: 0.5;
          }
        }
        #boot svg {
          animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          #boot svg {
            animation: none;
          }
        }
      </style>
      <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="#c6f24e" stroke-width="2.5" />
        <circle cx="16" cy="16" r="7.5" fill="none" stroke="#c6f24e" stroke-width="2.5" />
        <circle cx="16" cy="16" r="2.5" fill="#c6f24e" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
