<g clip-path="url(#c)"><rect width="120" height="120" fill="url(#bg)"></rect><rect width="120" height="120" fill="url(#cf)" opacity=".12"></rect><rect width="120" height="120" fill="url(#vg)"></rect></g>
</svg>
