<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24262a"></stop><stop offset="1" stop-color="#0a0b0c"></stop></linearGradient>
<pattern id="cf" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#5a5f66"></rect><rect x="3" y="3" width="3" height="3" fill="#5a5f66"></rect><rect x="3" width="3" height="3" fill="#24272b"></rect><rect y="3" width="3" height="3" fill="#24272b"></rect><rect width="3" height="1" fill="#fff" fill-opacity=".12"></rect><rect x="3" y="3" width="3" height="1" fill="#fff" fill-opacity=".12"></rect></pattern>
<clipPath id="c"><circle cx="60" cy="60" r="60"></circle></clipPath>
<radialGradient id="vg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0"></stop><stop offset="0.75" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.45"></stop></radialGradient>
