# An explicit project name, distinct from docker-compose.dev.yaml's, so running this (e.g. the
# e2e suite locally, alongside a live dev stack) never recreates the dev stack's same-named
# containers. See docker-compose.dev.yaml's own name: comment for the incident this guards
# against. Deliberately no persistent volume for postgres here — every e2e run starts clean.
name: dartcade-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dartgames
      POSTGRES_USER: dartgames
      POSTGRES_PASSWORD: dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dartgames']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install --prefer-offline && npm run dev"
    environment:
      DATABASE_URL: postgres://dartgames:dev@postgres:5432/dartgames
      NODE_ENV: test
      PORT: '3000'
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5174
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend/frontend:/app
      - ./backend/src/shared:/src/shared
      - /app/node_modules
    command: sh -c "npm install --prefer-offline && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_HOST: backend
    ports:
      - '5174:5173'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
