      responses:
        '200': { description: The profile, content: { application/json: { schema: { $ref: '#/components/schemas/PlayerProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
