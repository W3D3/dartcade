openapi: 3.0.3
info:
  title: Dartcade API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    HTTP API of the Dartcade backend, used by the web frontend and the Go bridge.
    Authentication endpoints (`/api/auth/*`) are provided by better-auth and documented separately.
    Operations tagged `bridge` are called by deployed bridges: keep them backwards compatible.
servers:
  - url: /
tags:
  - name: system
    description: Health checks
  - name: games
    description: Finished games (history)
  - name: gamemodes
    description: Available game modes
  - name: boards
    description: Paired boards and their Board Manager
  - name: pairing
    description: Pairing a bridge with a user account
  - name: sessions
    description: Game sessions (one active session per user)
  - name: users
    description: Other accounts, to play with
  - name: me
    description: The signed-in account (name, status)
  - name: lobbies
    description: Lobbies, to play games with friends (live state is on the lobby socket, schema/lobby-ws-v1.json)
  - name: invites
    description: Invites into lobbies
  - name: voices
    description: Caller voice packs each user imports (only their own; files stored once by content)
  - name: friends
    description: Friends and friend requests (live on /ws/me as the friends message)
  - name: bridge
    description: Operations the Go bridge depends on
security:
  - session: []

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      tags: [system]
      security: []
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/gamemodes:
    get:
      operationId: listGameModes
      summary: List game modes with their default config and config metadata
      tags: [gamemodes]
      security: []
      responses:
        '200':
          description: Available game modes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameModeList' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games:
    get:
      operationId: listGames
      summary: Finished games the signed-in user played in, newest first
      tags: [games]
      parameters:
        - { name: mode, in: query, required: false, schema: { type: string, minLength: 1 }, description: Only this game mode }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1 }, description: nextCursor of the previous page }
      responses:
        '200':
          description: A page of games
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games/stats:
    get:
      operationId: getGameStats
      summary: The signed-in user's results over the last days, per game mode
      tags: [games]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: Totals and per-mode stat aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getGame
      summary: A finished game with its per-mode detail
      description: Visible to the players holding a seat, or to anyone signed in if the game is public. Anything else is 404.
      tags: [games]
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards:
    get:
      operationId: listBoards
      summary: List the signed-in user's boards
      tags: [boards]
      responses:
        '200':
          description: The user's boards with live connection info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createBoard
      summary: Create a board and its bridge token (manual pairing)
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoardRequest' }
      responses:
        '201':
          description: The board, with the bridge token (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    patch:
      operationId: renameBoard
      summary: Rename a board
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameBoardRequest' }
      responses:
        '200':
          description: The renamed board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenamedBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteBoard
      summary: Unpair (delete) a board
      tags: [boards]
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/status:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getBoardStatus
      summary: Current Board Manager status
      tags: [boards]
      responses:
        '200':
          description: Board Manager state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/events:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getBoardEvents
      summary: Recent bridge events for the live feed (newest last, in memory)
      tags: [boards]
      responses:
        '200':
          description: Up to 50 recent events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/camera/{index}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: index
        in: path
        required: true
        description: Camera number, 0-based; 3 is the combined still (the three cameras blended)
        schema: { type: integer, minimum: 0, maximum: 3 }
    get:
      operationId: getBoardCamera
      summary: Latest camera still
      description: >-
        The board's latest still from this camera, straightened by the Board Manager: a square
        top-down JPEG with the bull at the centre, the outer double wire at a third of the width
        and 20 at the top. The bridge sends one after each dart, correction, takeout and resync;
        the backend keeps only the latest, in memory. For the board's owner and anyone who may
        watch the game on the board. With `v` (the version from the game socket's camera message)
        the browser may cache it for good; other queries (e.g. `?t=<timestamp>`) are ignored.
      tags: [boards]
      parameters:
        - name: v
          in: query
          required: false
          description: The still's version (CameraMessage.version); when it is the latest, the answer is cacheable for good
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: JPEG still
          headers:
            Cache-Control:
              description: '`private, max-age=31536000, immutable` for the latest version asked for with `v`, otherwise `no-store`'
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/camera/{index}/live:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: index
        in: path
        required: true
        description: Camera number, 0-based
        schema: { type: integer, minimum: 0, maximum: 2 }
    get:
      operationId: getBoardCameraLive
      summary: Live camera frame
      description: >-
        The camera's current raw frame, fetched from the Board Manager through the backend (for
        setting up a board; works only when the backend can reach the board's network). Owner only.
        Off (404) when the backend runs with BOARD_LIVE_CAMERA=off.
        Clients may append a cache-busting query (e.g. `?t=<timestamp>`); it is ignored.
      tags: [boards]
      responses:
        '200':
          description: JPEG frame
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/start:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: startBoard
      summary: Start dart detection
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: stopBoard
      summary: Stop dart detection
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/reset:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: resetBoard
      summary: Reset the board (clears thrown darts)
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/calibrate:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: calibrateBoard
      summary: Run automatic calibration
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/pairing/request:
    post:
      operationId: requestPairing
      summary: Request a pairing code (called by the bridge)
      description: Takes no body. Older bridges send `{}`, which is accepted.
      tags: [pairing, bridge]
      security: []
      responses:
        '201':
          description: A new code, valid for 10 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/pairing/{code}/token:
    parameters:
      - name: code
        in: path
        required: true
        description: Pairing code; case and separators are ignored
        schema: { type: string, minLength: 1, maxLength: 32 }
    get:
      operationId: getPairingToken
      summary: Poll for the bridge token of a claimed code (called by the bridge)
      tags: [pairing, bridge]
      security: []
      responses:
        '200':
          description: Pending, claimed (with the one-time token) or already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingTokenStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/pairing/claim:
    post:
      operationId: claimPairing
      summary: Claim a pairing code for the signed-in user, creating the board
      tags: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimPairingRequest' }
      responses:
        '201':
          description: The new board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimedBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: The code expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/users:
    get:
      operationId: searchUsers
      summary: Find the account with exactly this name, to invite it
      tags: [users]
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 100 },
            description: 'Their name, any case (a leading @ is fine)',
          }
      responses:
        '200':
          description: The account, if there is one (never yourself)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/users/name-available:
    get:
      operationId: checkNameAvailable
      summary: Whether a name can be yours (works signed out, for sign-up; your own name counts as free)
      tags: [users]
      security: []
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 64 }, description: The name as typed }
      responses:
        '200':
          description: Whether it's free, and why not
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NameAvailability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me:
    get:
      operationId: getMe
      summary: The signed-in account
      tags: [me]
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: updateMe
      summary: Change your name (checked like name-available), or go Invisible / Online
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The account as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in user's sessions
      tags: [sessions]
      responses:
        '200':
          description: The user's sessions (active and recently finished)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createSession
      summary: Start a game session
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: The new session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The user or the board already has an active session (sessionId is set for the user's own)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveSessionError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      summary: A session with its current game state
      tags: [sessions]
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteSession
      summary: End a session
      tags: [sessions]
      responses:
        '204':
          description: Ended
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies:
    post:
      operationId: createLobby
      summary: Open a lobby with the signed-in user as host, on their usual board
      tags: [lobbies]
      responses:
        '201':
          description: The new lobby
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/current:
    get:
      operationId: getCurrentLobby
      summary: The signed-in user's open lobby
      tags: [lobbies]
      responses:
        '200':
          description: The lobby; open /ws/lobby?lobbyId= for its live state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobby-codes/{code}:
    parameters:
      - $ref: '#/components/parameters/LobbyCode'
    get:
      operationId: getLobbyByCode
      summary: What the Join page shows about an open lobby before joining
      tags: [lobbies]
      responses:
        '200':
          description: The lobby's preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    patch:
      operationId: updateLobby
      summary: 'Host: rename, set the throw order, the next game or who can join, regenerate the code'
      tags: [lobbies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLobbyRequest' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/join:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: joinLobby
      summary: Join an open lobby by its code, or as a friend of the host
      tags: [lobbies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinLobbyRequest' }
      responses:
        '200':
          description: The lobby (joining again is fine)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/leave:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: leaveLobby
      summary: Leave the lobby, with your guests
      tags: [lobbies]
      responses:
        '204': { description: Left }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/close:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: closeLobby
      summary: 'Host: close the lobby (not while a game runs)'
      tags: [lobbies]
      responses:
        '204': { description: Closed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/people:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: addLobbyGuest
      summary: Add a guest at a board; the adder acts for them in games
      tags: [lobbies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddGuestRequest' }
      responses:
        '201':
          description: The guest's person id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/people/{personId}:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
      - $ref: '#/components/parameters/PersonId'
    patch:
      operationId: updateLobbyPerson
      summary: A person's board, ready, whether they play, their place in the order, or their team (as the lobby's rules allow)
      tags: [lobbies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePersonRequest' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: removeLobbyPerson
      summary: 'Remove someone: the host anyone, a member their own guests'
      tags: [lobbies]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/teams/shuffle:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: shuffleLobbyTeams
      summary: 'Host: a random 50/50 split of the people who play into Team A and Team B'
      description: 'Only while the next game is played in teams (400 otherwise). People sitting out keep their team.'
      tags: [lobbies]
      responses:
        '204': { description: Shuffled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/start:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: startLobbyGame
      summary: 'Host: start the next game with everyone who plays'
      description: "Answers 409 board_offline (with the boards), then 409 not_ready (with the names), when the host hasn't confirmed; send it again with force: true to start anyway (offline boards keep their seats, on manual entry until they're back)."
      tags: [lobbies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLobbyRequest' }
      responses:
        '201':
          description: The new game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies/{id}/invites:
    parameters:
      - $ref: '#/components/parameters/LobbyId'
    post:
      operationId: inviteToLobby
      summary: Invite an account into the lobby (any member)
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: The invite's id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/invites:
    get:
      operationId: listInvites
      summary: The signed-in user's pending invites to open lobbies, newest first
      tags: [invites]
      responses:
        '200':
          description: Pending invites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/invites/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteId'
    post:
      operationId: acceptInvite
      summary: Accept an invite and join its lobby
      tags: [invites]
      responses:
        '200':
          description: The lobby joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/invites/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/InviteId'
    post:
      operationId: declineInvite
      summary: Decline an invite
      tags: [invites]
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/voice-packs:
    get:
      operationId: listVoicePacks
      summary: The signed-in user's voice packs, oldest first, and their storage use
      tags: [voices]
      responses:
        '200':
          description: Packs and usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoicePackList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: uploadVoicePack
      summary: Import a voice pack from a zip file
      description: >
        A darts-caller download or a zip of clips named by key. Only the caller's clips are kept;
        the zip itself is not stored. One import at a time per user.
      tags: [voices]
      parameters:
        - name: name
          in: query
          required: true
          description: The file name, e.g. `en-GB-Arthur-Male-v4.zip`; the pack's name and language come from it
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary, description: At most 128 MB }
      responses:
        '201':
          description: The imported pack
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoicePackImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/VoiceLimit' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/ImportRunning' }

  /api/voice-packs/import:
    post:
      operationId: importVoicePack
      summary: Import a voice pack from a link
      description: >
        A darts-caller zip link or a Tools for Autodarts style folder link (the server tries the
        known clip names, as a folder has no listing). HTTPS links on darts-downloads.peschi.org,
        autodarts.x10.mx and adt-socket.tobias-thiele.de only; at most 128 MB; redirects only on
        the same host. One import at a time per user.
      tags: [voices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, minLength: 1, maxLength: 2048, description: 'e.g. https://autodarts.x10.mx/1_male_eng/' }
      responses:
        '201':
          description: The imported pack
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoicePackImport' }
        '400':
          description: The link can't be imported (site not allowed, nothing there, too big, no answer, not a pack)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: "Links from this site aren't supported" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/VoiceLimit' }
        '429': { $ref: '#/components/responses/ImportRunning' }

  /api/voice-packs/{id}:
    parameters:
      - $ref: '#/components/parameters/VoicePackId'
    get:
      operationId: getVoicePack
      summary: A voice pack's clips per key (one of the signed-in user's)
      tags: [voices]
      responses:
        '200':
          description: The pack's manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoicePackManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteVoicePack
      summary: Remove one of the signed-in user's voice packs
      tags: [voices]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/voice-clips/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        description: The clip's SHA-256, as a voice pack manifest lists it
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    get:
      operationId: getVoiceClip
      summary: A clip's audio, if one of the signed-in user's packs uses it
      description: The content never changes for a hash, so the response may be cached for good.
      tags: [voices]
      responses:
        '200':
          description: The audio file
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, max-age=31536000, immutable' }
          content:
            audio/*:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/friends:
    get:
      operationId: listFriends
      summary: Your friends and friend requests
      tags: [friends]
      responses:
        '200': { description: The list, content: { application/json: { schema: { $ref: '#/components/schemas/FriendList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/friends/requests:
    post:
      operationId: sendFriendRequest
      summary: Ask someone by name; if they already asked you, this accepts theirs
      tags: [friends]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FriendRequest' } } }
      responses:
        '200':
          {
            description: They had asked you first; you are friends now,
            content: { application/json: { schema: { $ref: '#/components/schemas/FriendRequestResult' } } },
          }
        '201':
          { description: Request sent, content: { application/json: { schema: { $ref: '#/components/schemas/FriendRequestResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/FriendConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/friends/requests/{id}:
    parameters: [{ $ref: '#/components/parameters/FriendRequestId' }]
    delete:
      operationId: cancelFriendRequest
      summary: Take back a request you sent
      tags: [friends]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/friends/requests/{id}/accept:
    parameters: [{ $ref: '#/components/parameters/FriendRequestId' }]
    post:
      operationId: acceptFriendRequest
      summary: Accept a request for you
      tags: [friends]
      responses:
        '204': { description: Friends now }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/friends/requests/{id}/decline:
    parameters: [{ $ref: '#/components/parameters/FriendRequestId' }]
    post:
      operationId: declineFriendRequest
      summary: Decline a request for you (the sender isn't told; they may ask again)
      tags: [friends]
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/friends/{userId}:
    parameters: [{ $ref: '#/components/parameters/FriendUserId' }]
    delete:
      operationId: removeFriend
      summary: Remove a friend (either side)
      tags: [friends]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: better-auth session cookie, set by signing in via /api/auth

  parameters:
    BoardId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    GameId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    LobbyId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    InviteId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VoicePackId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    LobbyCode:
      name: code
      in: path
      required: true
      description: Lobby code; case, dashes and spaces are ignored
      schema: { type: string, minLength: 1, maxLength: 16 }
    FriendRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    FriendUserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

  responses:
    BadRequest:
      description: The request doesn't match the spec
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The resource belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BoardError:
      description: Board Manager rejected the request or failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BoardUnavailable:
      description: The board is offline or unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BoardActionDone:
      description: Board Manager accepted the command
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BoardActionResult' }
    LobbyConflict:
      description: Conflicts with the lobby's state (see code)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LobbyConflict' }
    VoiceLimit:
      description: The pack doesn't fit the user's voice storage limit, imports are turned off, or the upload is too large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Voice storage limit reached: 10.0 of 50 MB used, this pack needs 45.2 MB' }
    UnsupportedMediaType:
      description: The body isn't of the content type the operation takes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ImportRunning:
      description: The user already has an import running, the server is running as many as it takes, or the rate limit was exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FriendConflict:
      description: Already friends, or a request is already pending
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FriendConflict' }

  schemas:
    Player: { $ref: 'common-v1.json#/$defs/Player' }
    Dart: { $ref: 'common-v1.json#/$defs/Dart' }
    ErrorResponse: { $ref: 'common-v1.json#/$defs/ErrorResponse' }

    Segment: { $ref: 'common-v1.json#/$defs/Segment' }
    TeamView: { $ref: 'common-v1.json#/$defs/TeamView' }

    FriendList: { $ref: 'common-v1.json#/$defs/FriendList' }
    FriendRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 'Their exact name, any case; a leading @ is fine' }
    FriendRequestResult:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, accepted], description: 'accepted: they had asked you first, so you are friends now' }
    FriendConflict:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
        code: { type: string, enum: [already_friends, already_requested] }

    HistoryDart:
      type: object
      required: [index, segment, coords, source, corrected, thrownAt]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0, maximum: 2, description: Position in the visit }
        segment: { $ref: '#/components/schemas/Segment' }
        coords:
          type: object
          nullable: true
          required: [x, y]
          additionalProperties: false
          description: Normalised board position (r = 1 at the outer double wire); null for a manual dart without one
          properties:
            x: { type: number }
            y: { type: number }
        source: { type: string, enum: [camera, manual] }
        corrected: { type: boolean, description: A correction (camera or by hand) changed this dart }
        thrownAt: { type: string, format: date-time }
    X01Detail:
      type: object
      required: [mode, legs]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [x01] }
        teams:
          type: array
          description: Only in a team game
          items: { $ref: '#/components/schemas/TeamView' }
        legs:
          type: array
          items:
            type: object
            required: [leg, starter, winner, visits]
            additionalProperties: false
            properties:
              leg: { type: integer, minimum: 0 }
              starter: { type: integer, minimum: 0, description: Seat that threw first in this leg }
              winner: { type: integer, minimum: 0, nullable: true, description: 'null: the leg was cut short by the round limit' }
              visits:
                type: array
                items:
                  type: object
                  required: [visit, seat, committedAt, darts, scored, remaining, bust]
                  additionalProperties: false
                  properties:
                    visit: { type: integer, minimum: 0 }
                    seat: { type: integer, minimum: 0 }
                    committedAt: { type: string, format: date-time }
                    darts: { type: array, items: { $ref: '#/components/schemas/HistoryDart' } }
                    scored: { type: integer, minimum: 0 }
                    remaining: { type: integer, minimum: 0 }
                    bust: { type: boolean }
    MinigolfDetail:
      type: object
      required: [mode, course, holes, scores]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [minigolf] }
        course: { type: string, description: 'The course name ("Mixed course" for random holes)' }
        holes:
          type: array
          description: The holes in the order played
          items:
            type: object
            required: [name, par]
            additionalProperties: false
            properties:
              name: { type: string }
              par: { type: integer, minimum: 1 }
        scores:
          type: array
          description: 'Strokes per hole (in hole order), then per seat; null for a hole not finished'
          items: { type: array, items: { type: integer, minimum: 1, nullable: true } }
    AtcDetail:
      type: object
      required: [mode, visits, progress, sequence]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [atc] }
        sequence:
          type: array
          description: Every target in order, 1–20, 21 = 25, 22 = bull
          items: { type: integer }
        visits:
          type: array
          items:
            type: object
            required: [visit, seat, committedAt, darts, hits, targetBefore, targetAfter]
            additionalProperties: false
            properties:
              visit: { type: integer, minimum: 0 }
              seat: { type: integer, minimum: 0 }
              committedAt: { type: string, format: date-time }
              darts: { type: array, items: { $ref: '#/components/schemas/HistoryDart' } }
              hits: { type: integer, minimum: 0, maximum: 3 }
              targetBefore: { type: integer, description: 'Target at the start of the visit (1–20, 21 = 25, 22 = bull)' }
              targetAfter: { type: integer, description: Target after the visit; past the last target means finished }
        progress:
          type: array
          description: One per seat, in seat order. Every target the seat got to, in order.
          items:
            type: object
            required: [seat, steps]
            additionalProperties: false
            properties:
              seat: { type: integer, minimum: 0 }
              steps:
                type: array
                items:
                  type: object
                  required: [target, darts, hit]
                  additionalProperties: false
                  properties:
                    target: { type: integer, description: '1–20, 21 = 25, 22 = bull' }
                    darts: { type: integer, minimum: 0, description: 'Darts thrown at it; 0 when a multiplier skipped it' }
                    hit: { type: boolean, description: 'Completed; false only for the target the game ended on' }

    Health:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }

    ConfigFieldMeta:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string }
        tooltip: { type: string }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            additionalProperties: false
            properties:
              value:
                anyOf:
                  - { type: string }
                  - { type: number }
                  - { type: boolean }
              label: { type: string }
    GameInfo:
      type: object
      required: [id, defaultConfig, configMeta, teams, supportsBots]
      additionalProperties: false
      properties:
        id: { type: string }
        defaultConfig: { type: object, additionalProperties: true }
        configMeta:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ConfigFieldMeta' }
        teams: { type: boolean, description: 'The game can be played in teams (its config takes format and teams)' }
        supportsBots: { type: boolean, description: 'The game can seat a bot (its module defines botTarget)' }
    GameModeList:
      type: object
      required: [modes]
      additionalProperties: false
      properties:
        modes:
          type: array
          items: { $ref: '#/components/schemas/GameInfo' }

    GameSeat:
      type: object
      required: [seat, name, userId, bot, placement, throwPosition, stats, forfeited]
      additionalProperties: false
      properties:
        seat: { type: integer, minimum: 0 }
        throwPosition:
          {
            type: integer,
            minimum: 0,
            nullable: true,
            description: 'Where the seat threw in the game (0 = first; a bull off can change it from the seat order). null for games finished before it was recorded',
          }
        name: { type: string }
        userId:
          {
            type: string,
            nullable: true,
            description: "The seat's account; null for guests and bots, and for everyone when viewing a public game you didn't play in",
          }
        bot:
          type: object
          nullable: true
          required: [level]
          additionalProperties: false
          properties:
            level: { type: integer, minimum: 1, maximum: 10 }
          description: "A bot's difficulty 1-10; null for a member or guest."
        placement: { type: integer, minimum: 1 }
        stats:
          type: object
          additionalProperties: { type: number }
          description: Per game mode, e.g. X01 average, dartsThrown, legsWon, pointsScored; ATC dartsThrown, targetsHit
        forfeited:
          type: boolean
          description: The seat gave up (abandoned) the game; placed last.
    GameSummary:
      type: object
      required: [id, mode, config, createdAt, finishedAt, board, mySeat, players]
      additionalProperties: false
      properties:
        id: { type: string }
        mode: { type: string }
        config: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        board:
          type: object
          nullable: true
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
        mySeat: { type: integer, minimum: 0, nullable: true }
        players:
          type: array
          items: { $ref: '#/components/schemas/GameSeat' }
    GameList:
      type: object
      required: [games, nextCursor]
      additionalProperties: false
      properties:
        games:
          type: array
          items: { $ref: '#/components/schemas/GameSummary' }
        nextCursor: { type: string, nullable: true }
    StatAggregate:
      type: object
      required: [avg, min, max, sum, previousAvg]
      additionalProperties: false
      properties:
        avg: { type: number }
        sum: { type: number }
        min: { type: number }
        max: { type: number }
        previousAvg: { type: number, nullable: true, description: Average over the period before; null without games then }
    ModeStats:
      type: object
      required: [matches, wins, contested, stats]
      additionalProperties: false
      properties:
        matches: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        contested: { type: integer, minimum: 0, description: Games with two or more seats }
        stats:
          type: object
          additionalProperties: { $ref: '#/components/schemas/StatAggregate' }
    GameStats:
      type: object
      required: [days, matches, wins, contested, modes]
      additionalProperties: false
      properties:
        days: { type: integer, minimum: 1 }
        matches: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0, description: 1st place in a contested game }
        contested: { type: integer, minimum: 0, description: Games with two or more seats; win rate = wins / contested }
        modes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ModeStats' }
    GameDetail:
      type: object
      required: [game, detail, stats]
      additionalProperties: false
      properties:
        game: { $ref: '#/components/schemas/GameSummary' }
        detail:
          oneOf:
            - $ref: '#/components/schemas/X01Detail'
            - $ref: '#/components/schemas/AtcDetail'
            - $ref: '#/components/schemas/MinigolfDetail'
          discriminator:
            propertyName: mode
            mapping:
              x01: '#/components/schemas/X01Detail'
              atc: '#/components/schemas/AtcDetail'
              minigolf: '#/components/schemas/MinigolfDetail'
        stats: { $ref: '#/components/schemas/MatchStats' }

    MatchStats:
      type: object
      description: The game's match stats, the same shape for every game mode. Rows say how to show each value, so a mode adds stats without a frontend change.
      required: [rows, seats]
      additionalProperties: false
      properties:
        rows:
          type: array
          description: In display order
          items: { $ref: '#/components/schemas/StatRow' }
        seats:
          type: array
          description: One per seat, in seat order
          items: { $ref: '#/components/schemas/StatValues' }
        teams:
          type: array
          description: Only in a team game; one per team. Seats keep their own values.
          items: { $ref: '#/components/schemas/StatValues' }

    StatValues:
      type: object
      description: 'seat or team (the index), and its values by key; a missing key means the stat does not apply'
      required: [index, values]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0 }
        values:
          type: object
          additionalProperties: { type: number }

    StatRow:
      type: object
      required: [key, label, format, better, compact]
      additionalProperties: false
      properties:
        key: { type: string, description: 'Names the row (e.g. first9Average); also the key of its value unless `value` says otherwise' }
        label: { type: string }
        format:
          type: string
          enum: [decimal, integer, darts, target, ratio]
          description: 'decimal 83.9, integer 6, darts "15 darts", target 1–20 / 21 = 25 / 22 = Bull, ratio "50% · 3/6"'
        value: { type: string, description: "The key holding the row's value (for a ratio, the numerator); default `key`" }
        of: { type: string, description: 'ratio only: the key of the denominator' }
        better:
          type: string
          enum: [higher, lower, null]
          nullable: true
          description: null when no side is better (e.g. darts thrown)
        compact: { type: boolean, description: 'Also shown where space is short (party standings, phone)' }

    Board:
      type: object
      required: [id, name, hardwareId, online, bridgeVersion, bmVersion, createdAt, ip, bmUrl]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        hardwareId: { type: string, nullable: true }
        online: { type: boolean }
        bridgeVersion: { type: string, nullable: true, description: 'Bridge build, e.g. v0.4.2 or dev+b503493-dirty' }
        bmVersion: { type: string, nullable: true, description: Board Manager version }
        createdAt: { type: string, format: date-time, description: When the board was paired }
        ip: { type: string, nullable: true, description: Board Manager host name }
        bmUrl: { type: string, nullable: true, description: 'Board Manager origin incl. port, e.g. http://192.168.0.109:3180' }
    BoardList:
      type: object
      required: [boards]
      additionalProperties: false
      properties:
        boards:
          type: array
          items: { $ref: '#/components/schemas/Board' }
    CreateBoardRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 64 }
    CreatedBoard:
      type: object
      required: [id, name, token]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        token: { type: string, description: Bridge token; shown only once }
    RenameBoardRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 64 }
    RenamedBoard:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
    BoardStatus:
      type: object
      required: [status, running, event]
      additionalProperties: false
      properties:
        status: { type: string, nullable: true }
        running: { type: boolean }
        event: { type: string, nullable: true }
    BoardEvent:
      type: object
      required: [at, kind, data]
      additionalProperties: false
      properties:
        at: { type: string, description: When the bridge received it (ISO timestamp) }
        kind: { type: string, enum: [dart.detected, dart.corrected, takeout.started, visit.cleared] }
        data:
          type: object
          additionalProperties: true
          properties:
            dart: { $ref: '#/components/schemas/Dart' }
    BoardEventList:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/BoardEvent' }
    BoardActionResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: integer, description: HTTP status Board Manager answered with }

    PairingCode:
      type: object
      required: [code, expiresAt]
      additionalProperties: false
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
    PairingTokenStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending, claimed, consumed] }
        token: { type: string, description: Present only when status is claimed }
    ClaimPairingRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '\S', maxLength: 32 }
        name: { type: string, pattern: '\S', maxLength: 64 }
    ClaimedBoard:
      type: object
      required: [boardId, name]
      additionalProperties: false
      properties:
        boardId: { type: string }
        name: { type: string }

    SessionSummary:
      type: object
      required: [id, boardId, gameId, status, players, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        boardId: { type: string, nullable: true }
        gameId: { type: string }
        status: { type: string, enum: [active, finished] }
        players:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        createdAt: { type: string, format: date-time }
    SessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }
    SessionDetail:
      type: object
      required: [id, boardId, gameId, status, players, createdAt, game]
      additionalProperties: false
      properties:
        id: { type: string }
        boardId: { type: string, nullable: true }
        gameId: { type: string }
        status: { type: string, enum: [active, finished] }
        players:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        createdAt: { type: string, format: date-time }
        game:
          type: object
          nullable: true
          additionalProperties: true
          description: Current game state; its shape is specified by schema/game-ws-v1.json
    CreateSessionRequest:
      type: object
      required: [gameId, config, players]
      additionalProperties: false
      properties:
        boardId: { type: string, nullable: true, description: 'null or absent: manual entry without a board' }
        gameId: { type: string }
        config: { type: object, additionalProperties: true }
        players:
          type: array
          minItems: 1
          description: The first player is the signed-in user; the others are guests at the same board
          items: { $ref: '#/components/schemas/SeatRequest' }
    SeatRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
    UserSummary:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
    UserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
    Me:
      type: object
      required: [id, name, email, nameNeedsChange, suggestedName, invisible, isAdmin]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, description: 'Your handle, shown as @name' }
        email: { type: string }
        nameNeedsChange:
          {
            type: boolean,
            description: 'Your name broke the rules or duplicated an older one when names became unique: pick a new one first',
          }
        suggestedName: { type: string, nullable: true, description: 'A free name close to yours, while nameNeedsChange' }
        invisible: { type: boolean, description: 'Friends see you as offline' }
        isAdmin: { type: boolean, description: 'May open admin pages (the minigolf test bench)' }
    UpdateMeRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        invisible: { type: boolean }
    NameAvailability:
      type: object
      required: [available]
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [taken, invalid] }
    CreatedSession:
      type: object
      required: [sessionId]
      additionalProperties: false
      properties:
        sessionId: { type: string }
    ActiveSessionError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
        sessionId: { type: string, description: "The user's running session (absent when the board is busy)" }
    LobbyRef:
      type: object
      required: [id, name, code]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, description: '6 characters; shown as K7Q4-MD' }
    LobbyPreview:
      type: object
      required: [id, name, hostName, peopleCount, boardNames]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        hostName: { type: string, nullable: true }
        peopleCount: { type: integer, minimum: 0 }
        boardNames: { type: array, items: { type: string } }
    UpdateLobbyRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 48 }
        throwOrder: { type: string, enum: [lobby, random, bulloff] }
        nextGame:
          type: object
          nullable: true
          required: [gameId, config]
          additionalProperties: false
          properties:
            gameId: { type: string, minLength: 1 }
            config: { type: object, additionalProperties: true }
        access: { type: string, enum: [friends, invite], description: 'Host: who can join without the code' }
        regenerateCode: { type: boolean }
    JoinLobbyRequest:
      type: object
      additionalProperties: false
      description: 'Without a code: only a friend of the host, while the lobby is open to friends.'
      properties:
        code: { type: string, minLength: 1, maxLength: 16 }
    AddGuestRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 32 }
        boardId:
          {
            type: string,
            nullable: true,
            minLength: 1,
            description: "Absent: the adder's board. null: Manual. Otherwise one of the adder's own boards. Ignored if bot is set.",
          }
        bot:
          type: object
          nullable: true
          required: [level]
          additionalProperties: false
          properties:
            level: { type: integer, minimum: 1, maximum: 10 }
          description: 'Add a bot instead of a guest: the server throws for this seat, at this difficulty.'
    UpdatePersonRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        boardId: { type: string, nullable: true, minLength: 1, description: 'One of your own boards, or null for Manual' }
        plays: { type: boolean, description: 'false: sits out the next game' }
        ready: { type: boolean }
        position: { type: integer, minimum: 0, description: 'Host: move to this place in the lobby order' }
        team: { type: string, enum: [A, B], description: 'Host: move them to this team' }
    StartLobbyRequest:
      type: object
      additionalProperties: false
      properties:
        force: { type: boolean, description: "Start even though people who play aren't ready" }
    CreateInviteRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId: { type: string, minLength: 1 }
    CreatedId:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string }
    LobbyConflict:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
        code:
          {
            type: string,
            enum: [in_lobby, not_ready, board_offline, board_busy, active_session, game_running, already_member, already_invited],
          }
        lobbyId: { type: string, description: 'in_lobby: the lobby you are in; leave it first' }
        sessionId: { type: string, description: "game_running: the lobby's game. active_session: your own running game" }
        notReady:
          type: array
          description: "not_ready: who plays but isn't ready"
          items:
            type: object
            required: [personId, name]
            additionalProperties: false
            properties:
              personId: { type: string }
              name: { type: string }
        offlineBoards: { type: array, items: { type: string }, description: 'board_offline: the boards that are offline' }
    Invite:
      type: object
      required: [id, lobbyId, lobbyName, inviterUserId, inviterName, createdAt]
      additionalProperties: false
      description: Same shape as PendingInvite in schema/lobby-ws-v1.json
      properties:
        id: { type: string }
        lobbyId: { type: string }
        lobbyName: { type: string }
        inviterUserId: { type: string, nullable: true }
        inviterName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    InviteList:
      type: object
      required: [invites]
      additionalProperties: false
      properties:
        invites: { type: array, items: { $ref: '#/components/schemas/Invite' } }
    VoicePackSummary:
      type: object
      required: [id, name, lang, clips, bytes, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, description: 'From the file name or link, e.g. "en-GB Arthur (Male)"' }
        lang: { type: string, nullable: true, description: 'Language tag from the name, e.g. en-GB' }
        clips: { type: integer, minimum: 0, description: Distinct audio files kept }
        bytes: { type: integer, minimum: 0, description: Their total size; counts against the user's limit }
        createdAt: { type: string, format: date-time }
    VoicePackImport:
      type: object
      description: A pack just imported, with how many sound files its source had
      required: [id, name, lang, clips, bytes, createdAt, total]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, description: 'From the file name or link, e.g. "en-GB Arthur (Male)"' }
        lang: { type: string, nullable: true, description: 'Language tag from the name, e.g. en-GB' }
        clips: { type: integer, minimum: 0, description: Distinct audio files kept }
        bytes: { type: integer, minimum: 0, description: Their total size; counts against the user's limit }
        createdAt: { type: string, format: date-time }
        total: { type: integer, minimum: 0, description: 'Sound files in the source, kept or not ("Kept 385 of 12,422 clips")' }
    VoicePackList:
      type: object
      required: [packs, usage]
      additionalProperties: false
      properties:
        packs: { type: array, items: { $ref: '#/components/schemas/VoicePackSummary' } }
        usage:
          type: object
          required: [bytes, limitBytes]
          additionalProperties: false
          properties:
            bytes: { type: integer, minimum: 0, description: "Every file of the user's packs at full size, shared with others or not" }
            limitBytes: { type: integer, minimum: 0, description: The user's limit; 0 means imports are turned off }
    VoicePackManifest:
      type: object
      required: [id, name, clips]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        clips:
          type: object
          description: Caller key (`180`, `gameshot`, `leg_2`, …) → its variants' clip hashes (fetch each from /api/voice-clips/{sha256})
          additionalProperties:
            type: array
            minItems: 1
            items: { type: string, pattern: '^[0-9a-f]{64}$' }
