        '200':
          description: Pending invites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/invites/{id}/accept:
    parameters:
