openapi: 3.0.3
info:
  title: Dartcade API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    HTTP API of the Dartcade backend, used by the web frontend and the Go bridge.
    Authentication endpoints (`/api/auth/*`) are provided by better-auth and documented separately.
    Operations tagged `bridge` are called by deployed bridges: keep them backwards compatible.
servers:
  - url: /
tags:
  - name: system
    description: Health checks and deployment info
  - name: games
    description: Finished games (history)
  - name: gamemodes
    description: Available game modes
  - name: flags
    description: Feature flags over the OpenFeature Remote Evaluation Protocol (OFREP v1), for the SPA's OFREP web provider
  - name: boards
    description: Paired boards and their Board Manager
  - name: pairing
    description: Pairing a bridge with a user account
  - name: sessions
    description: Game sessions (one active session per user)
  - name: users
    description: Other accounts, to play with
  - name: me
    description: The signed-in account (name, status)
  - name: lobbies
    description: Lobbies, to play games with friends (live state is on the lobby socket, schema/lobby-ws-v1.json)
  - name: invites
    description: Invites into lobbies
  - name: voices
    description: Caller voice packs each user imports (only their own; files stored once by content)
  - name: friends
    description: Friends and friend requests (live on /ws/me as the friends message)
  - name: ranked
    description: Ranked matchmaking (ratings and ranks per mode)
  - name: progress
    description: XP, levels, day streaks, challenges and cosmetics (progression.enabled)
  - name: admin
    description: Admin-only account management (list users, promote or demote admins) and feature flag overrides
  - name: minigolf
    description: >-
      Minigolf courses and holes (admin-only drafts and writes; players read published official
      courses)
  - name: lights
    description: WLED devices paired to a board, and the light profile that drives them as games change
  - name: bridge
    description: Operations the Go bridge depends on
security:
  - session: []

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      tags: [system]
      security: []
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/preview:
    get:
      operationId: getPreview
      summary: Which pull request this deployment previews (null outside a PR preview)
      tags: [system]
      security: []
      responses:
        '200':
          description: The preview this deployment is, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewInfo' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/version:
    get:
      operationId: getVersion
      summary: The version, commit and build time of the running server
      tags: [system]
      security: []
      responses:
        '200':
          description: The running build
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildInfo' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth-info:
    get:
      operationId: getAuthInfo
      summary: Whether this deployment sends mail and requires email verification
      tags: [system]
      security: []
      responses:
        '200':
          description: The deployment's sign-up settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthInfo' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/legal/{doc}:
    get:
      operationId: getLegalDoc
      summary: A legal text of this deployment (Terms, Privacy Policy, Imprint), as HTML
      tags: [system]
      security: []
      parameters:
        - { name: doc, in: path, required: true, schema: { type: string, enum: [terms, privacy, imprint] } }
      responses:
        '200':
          description: The text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDoc' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/gamemodes:
    get:
      operationId: listGameModes
      summary: List game modes with their default config and config metadata
      tags: [gamemodes]
      security: []
      responses:
        '200':
          description: Available game modes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameModeList' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games:
    get:
      operationId: listGames
      summary: Finished games the signed-in user played in, newest first
      tags: [games]
      parameters:
        - { name: mode, in: query, required: false, schema: { type: string, minLength: 1 }, description: Only this game mode }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1 }, description: nextCursor of the previous page }
      responses:
        '200':
          description: A page of games
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games/stats:
    get:
      operationId: getGameStats
      summary: The signed-in user's results over the last days, per game mode
      tags: [games]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: Totals and per-mode stat aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games/best:
    get:
      operationId: getBestStat
      summary: The signed-in user's all-time best value of one stat in one game mode
      tags: [games]
      parameters:
        - { name: mode, in: query, required: true, schema: { type: string, pattern: '^[a-z0-9_]{1,32}$' } }
        - { name: stat, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_]{1,32}$' } }
      responses:
        '200':
          description: The best value and when it was reached; null without one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BestStat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getGame
      summary: A finished game with its per-mode detail
      description: Visible to the players holding a seat, or to anyone signed in if the game is public. Anything else is 404.
      tags: [games]
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards:
    get:
      operationId: listBoards
      summary: List the signed-in user's boards
      tags: [boards]
      responses:
        '200':
          description: The user's boards with live connection info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createBoard
      summary: Create a board and its bridge token (manual pairing)
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoardRequest' }
      responses:
        '201':
          description: The board, with the bridge token (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    patch:
      operationId: renameBoard
      summary: Rename a board
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameBoardRequest' }
      responses:
        '200':
          description: The renamed board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenamedBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteBoard
      summary: Unpair (delete) a board
      tags: [boards]
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/status:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getBoardStatus
      summary: Current Board Manager status
      tags: [boards]
      responses:
        '200':
          description: Board Manager state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/events:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getBoardEvents
      summary: Recent bridge events for the live feed (newest last, in memory)
      tags: [boards]
      responses:
        '200':
          description: Up to 50 recent events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/camera/{index}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: index
        in: path
        required: true
        description: Camera number, 0-based; 3 is the combined still (the three cameras blended)
        schema: { type: integer, minimum: 0, maximum: 3 }
    get:
      operationId: getBoardCamera
      summary: Latest camera still
      description: >-
        The board's latest still from this camera, straightened by the Board Manager: a square
        top-down JPEG with the bull at the centre, the outer double wire at a third of the width
        and 20 at the top. The bridge sends one after each dart, correction, takeout and resync;
        the backend keeps only the latest, in memory. For the board's owner and anyone who may
        watch the game on the board. With `v` (the version from the game socket's camera message)
        the browser may cache it for good; other queries (e.g. `?t=<timestamp>`) are ignored.
      tags: [boards]
      parameters:
        - name: v
          in: query
          required: false
          description: The still's version (CameraMessage.version); when it is the latest, the answer is cacheable for good
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: JPEG still
          headers:
            Cache-Control:
              description: '`private, max-age=31536000, immutable` for the latest version asked for with `v`, otherwise `no-store`'
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/camera/{index}/live:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: index
        in: path
        required: true
        description: Camera number, 0-based
        schema: { type: integer, minimum: 0, maximum: 2 }
    get:
      operationId: getBoardCameraLive
      summary: Live camera frame
      description: >-
        The camera's current raw frame, fetched from the Board Manager by the board's bridge (for
        setting up a board). Owner only.
        Clients may append a cache-busting query (e.g. `?t=<timestamp>`); it is ignored.
      tags: [boards]
      responses:
        '200':
          description: JPEG frame
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/start:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: startBoard
      summary: Start dart detection
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: stopBoard
      summary: Stop dart detection
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/reset:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: resetBoard
      summary: Reset the board (clears thrown darts)
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/calibrate:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: calibrateBoard
      summary: Run automatic calibration
      tags: [boards]
      responses:
        '200': { $ref: '#/components/responses/BoardActionDone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BoardError' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/bridge-update:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: updateBridge
      summary: Update the board's bridge to the release this server offers
      description: >-
        Sends the bridge a bridge.update over its socket. The bridge downloads the release itself,
        verifies its signed checksums, swaps its binary and restarts; its progress shows in the
        board's bridgeUpdate.status (GET /api/boards). Owner only.
      tags: [boards]
      responses:
        '202':
          description: The bridge was asked to update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeUpdateStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/lights:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getBoardLights
      summary: The board's WLED devices, what its bridge found, and the light profile
      tags: [lights]
      responses:
        '200':
          description: Lights
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardLights' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      operationId: setBoardLights
      summary: Turn the board's lights on or off (devices and rules are kept)
      tags: [lights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/lights/scan:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: scanBoardLights
      summary: Ask the bridge to look for WLED devices now
      tags: [lights]
      responses:
        '202': { description: Asked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/lights/probe:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: probeBoardLights
      summary: Ask the bridge whether a WLED answers at this address
      tags: [lights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              additionalProperties: false
              properties:
                host: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9.\-:\[\]]+$' }
      responses:
        '202': { description: Asked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/lights/blink:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: blinkBoardLights
      summary: Blink a found or paired WLED device so you can tell which one it is
      tags: [lights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                host: { type: string, maxLength: 253 }
                deviceId: { type: string }
      responses:
        '202': { description: Asked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/boards/{id}/lights/devices:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: addWledDevice
      summary: Pair a WLED device the bridge found
      tags: [lights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac, name, segmentMode, maxBri]
              additionalProperties: false
              properties:
                mac: { type: string }
                name: { type: string, minLength: 1, maxLength: 40 }
                segmentMode: { type: string, enum: [whole, perSeat, wled] }
                maxBri: { type: integer, minimum: 1, maximum: 255 }
      responses:
        '201':
          description: Paired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WledDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/lights/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - name: deviceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    patch:
      operationId: updateWledDevice
      summary: Rename a device or change its segments or brightness cap
      tags: [lights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                segmentMode: { type: string, enum: [whole, perSeat, wled] }
                maxBri: { type: integer, minimum: 1, maximum: 255 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WledDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteWledDevice
      summary: Unpair a device
      tags: [lights]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/boards/{id}/lights/test:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: testBoardLight
      summary: Play one rule of the board's light profile on its devices
      tags: [lights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              additionalProperties: false
              properties:
                rule: { type: integer, minimum: 0 }
      responses:
        '202': { description: Played }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/BoardUnavailable' }

  /api/pairing/request:
    post:
      operationId: requestPairing
      summary: Request a pairing code (called by the bridge)
      description: Takes no body. Older bridges send `{}`, which is accepted.
      tags: [pairing, bridge]
      security: []
      responses:
        '201':
          description: A new code, valid for 10 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/pairing/{code}/token:
    parameters:
      - name: code
        in: path
        required: true
        description: Pairing code; case and separators are ignored
        schema: { type: string, minLength: 1, maxLength: 32 }
    get:
      operationId: getPairingToken
      summary: Poll for the bridge token of a claimed code (called by the bridge)
      tags: [pairing, bridge]
      security: []
      responses:
        '200':
          description: Pending, claimed (with the one-time token) or already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingTokenStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/pairing/claim:
    post:
      operationId: claimPairing
      summary: Claim a pairing code for the signed-in user, creating the board
      tags: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimPairingRequest' }
      responses:
        '201':
          description: The new board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimedBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: The code expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/bridge-install-tokens:
    post:
      operationId: createBridgeInstallToken
      summary: Make a one-time token for a bridge install command (valid for 15 minutes, shown once)
      tags: [pairing]
      responses:
        '201':
          description: The new token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeInstallToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/bridge-install-tokens/exchange:
    post:
      operationId: exchangeBridgeInstallToken
      summary: A bridge swaps its install token for its own board token. The board appears in the account that made the install token. Used once.
      tags: [pairing, bridge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        '201':
          description: The bridge's own token, for the board that was just made
          content:
            application/json:
              schema:
                type: object
                required: [token]
                additionalProperties: false
                properties:
                  token: { type: string }
        '404':
          description: Unknown, used or expired install token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/users:
    get:
      operationId: searchUsers
      summary: Find the account with exactly this name, to invite it
      tags: [users]
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 100 },
            description: 'Their name, any case (a leading @ is fine)',
          }
      responses:
        '200':
          description: The account, if there is one (never yourself)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/users/{id}/avatar:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's id
        schema: { type: string }
    get:
      operationId: getUserAvatar
      summary: A user's uploaded profile picture
      description: >-
        404 unless they have an uploaded photo (none/preset avatars have nothing to fetch; the
        frontend renders those itself). With `v` matching their avatar's current version, the
        browser may cache it for good.
      tags: [users]
      parameters:
        - name: v
          in: query
          required: false
          description: "The avatar's version (Avatar.version); when it is the latest, the answer is cacheable for good"
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The photo
          headers:
            Cache-Control:
              description: '`private, max-age=31536000, immutable` for the latest version asked for with `v`, otherwise `no-store`'
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/users/name-available:
    get:
      operationId: checkNameAvailable
      summary: Whether a name can be yours (works signed out, for sign-up; your own name counts as free)
      tags: [users]
      security: []
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 64 }, description: The name as typed }
      responses:
        '200':
          description: Whether it's free, and why not
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NameAvailability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/system:
    get:
      operationId: getAdminSystem
      summary: Build, runtime, database, live counts and non-secret config of this server (admin)
      tags: [admin]
      responses:
        '200':
          description: The system details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSystem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/games:
    get:
      operationId: listAdminGames
      summary: Every game on the platform, newest started first (admin or moderator)
      description: Finished games by default (invalidated ones included, marked); `status` also lists aborted and active ones, or only the invalidated ones.
      tags: [admin]
      parameters:
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [finished, aborted, active, invalidated, all], default: finished },
          }
        - { name: mode, in: query, required: false, schema: { type: string, minLength: 1 }, description: Only this game mode }
        - {
            name: player,
            in: query,
            required: false,
            schema: { type: string, minLength: 1, maxLength: 100 },
            description: "A seat's name contains this (case-insensitive), or its account id is this",
          }
        - { name: board, in: query, required: false, schema: { type: string, minLength: 1 }, description: Only games on this board id }
        - { name: ranked, in: query, required: false, schema: { type: boolean }, description: 'true: only ranked games' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: Started at or after }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: Started before }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1 }, description: nextCursor of the previous page }
      responses:
        '200':
          description: A page of games
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGameList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getAdminGame
      summary: A finished game with its per-mode detail, whoever played it (admin or moderator)
      description: Account ids of every seat are included, and how the game was invalidated, if it was.
      tags: [admin]
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGameDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    delete:
      operationId: deleteAdminGame
      summary: Delete a finished or aborted game for good, and recalculate the ratings it counted in (admin only)
      description: Moderators invalidate instead. The game, its seats, darts and input log go with it, invalidated or not, so history and stats follow. Ranked ratings of the modes it was rated in are replayed without it. A game in progress is refused.
      tags: [admin]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGameRecalculated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The game is in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/games/{id}/invalidate:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: invalidateAdminGame
      summary: Invalidate a finished game and recalculate the ratings it counted in (admin or moderator)
      description: The game stays, marked invalidated with who did it and an optional reason, but no longer counts in stats, best values or ratings. Its players still see it in their history, marked invalidated, without the reason or the moderator. Ranked ratings of the modes it was rated in are replayed without it. Only a finished game that is not invalidated yet can be.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvalidateGameRequest' }
      responses:
        '200':
          description: Invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGameRecalculated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The game is not finished, or already invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/games/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: restoreAdminGame
      summary: Take an invalidation back, and recalculate the ratings with the game again (admin or moderator)
      description: The game counts in history, stats and best values again. Ranked ratings of the modes it was rated in are replayed with it, in the order the games were played.
      tags: [admin]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGameRecalculated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The game is not invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/users:
    get:
      operationId: listAdminUsers
      summary: Every account, newest first, at most 200 (admin)
      tags: [admin]
      parameters:
        - {
            name: q,
            in: query,
            required: false,
            description: 'Filter by name or email, case-insensitive, contains',
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    put:
      operationId: setUserRole
      summary: Set a user's role; refused if it would leave no admin (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetUserRoleRequest' }
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastAdminConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/users/{id}/verified:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    put:
      operationId: setUserVerified
      summary: Mark an account's email as verified or unverified (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetUserVerifiedRequest' }
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/flags:
    get:
      operationId: listAdminFlags
      summary: Every feature flag, its default, override and current value for you (admin)
      tags: [admin]
      responses:
        '200':
          description: The flags, and any stored override whose key no longer matches a flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFlagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/flags/{key}:
    parameters:
      - $ref: '#/components/parameters/FlagKey'
    put:
      operationId: setFlagOverride
      summary: Override a flag at runtime, applied immediately, no restart (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFlagOverrideRequest' }
      responses:
        '200':
          description: The flag, as in the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFlag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: clearFlagOverride
      summary: Remove a flag's override, back to its default behaviour (admin)
      tags: [admin]
      responses:
        '204': { description: 'Cleared, also for a stale key no longer in FLAG_META' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /ofrep/v1/evaluate/flags:
    post:
      operationId: ofrepEvaluateFlags
      summary: 'Every flag for the signed-in user (signed out, for an anonymous user: only what everyone gets)'
      description: The request's context is ignored; flags are evaluated for the session's user. An ETag comes with the result; a matching If-None-Match answers 304.
      tags: [flags]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfrepRequest' }
      responses:
        '200':
          description: The flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepBulkResponse' }
        '304': { description: Unchanged since the ETag sent in If-None-Match }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /ofrep/v1/evaluate/flags/{key}:
    post:
      operationId: ofrepEvaluateFlag
      summary: One flag for the signed-in user
      tags: [flags]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfrepRequest' }
      responses:
        '200':
          description: The flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepEvaluation' }
        '404':
          description: No such flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfrepFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in account
      tags: [me]
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: updateMe
      summary: Change your name (checked like name-available), or go Invisible / Online
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The account as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me/avatar:
    post:
      operationId: uploadAvatar
      summary: Set your profile picture to an uploaded photo
      description: >-
        A JPEG, resized and cropped to a square by the browser before sending. Replaces any
        preset or earlier photo.
      tags: [me]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, description: At most 512 KB }
      responses:
        '200':
          description: The account as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me/preferences:
    get:
      operationId: getPreferences
      summary: Your account-wide game and caller preferences (only the ones you have set)
      tags: [me]
      responses:
        '200':
          description: The preferences you have set; a missing one is the app's default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      operationId: updatePreferences
      summary: Set some preferences; the ones left out keep their value, unknown ones are dropped
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: All your preferences as they are now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in user's sessions
      tags: [sessions]
      responses:
        '200':
          description: The user's sessions (active and recently finished)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createSession
      summary: Start a game session
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: The new session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The user or the board already has an active session (sessionId is set for the user's own)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveSessionError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      summary: A session with its current game state
      tags: [sessions]
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteSession
      summary: End a session
      tags: [sessions]
      responses:
        '204':
          description: Ended
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/lobbies:
    post:
      operationId: createLobby
      summary: Open a lobby with the signed-in user as host, on their usual board
      tags: [lobbies]
      responses:
        '201':
          description: The new lobby
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LobbyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

