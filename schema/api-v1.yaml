    get:
      operationId: getMinigolfCourse
      summary: A course; players see it only once published, without a draft
      tags: [minigolf]
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfCourse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: saveMinigolfCourse
      summary: Overwrite the draft if `version` is still current (admin)
      tags: [minigolf]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MinigolfCourseSave' }
      responses:
        '200':
          description: The saved course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfCourse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteMinigolfCourse
      summary: Delete a course; a built-in course can't be deleted, only unpublished (admin)
      tags: [minigolf]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/minigolf/courses/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/MinigolfCourseId'
    post:
      operationId: publishMinigolfCourse
      summary: >-
        Publish the course's draft: checks it and every hole it uses, and refuses with the
        failing checks if any blocks (admin)
      tags: [minigolf]
      responses:
        '200':
          description: The published course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfCourse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MinigolfPublishRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/minigolf/courses/{id}/discard:
    parameters:
      - $ref: '#/components/parameters/MinigolfCourseId'
    post:
      operationId: discardMinigolfCourse
      summary: >-
        Clear the course's draft, and the drafts of its holes that no other course uses (in its
        draft or published) (admin)
      tags: [minigolf]
      responses:
        '200':
          description: The course, draft discarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfCourse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/minigolf/courses/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/MinigolfCourseId'
    post:
      operationId: unpublishMinigolfCourse
      summary: >-
        Take the course out of play: its published content becomes its draft (unless it has
        one), and Publish brings it back (admin)
      tags: [minigolf]
      responses:
        '200':
          description: The course, unpublished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfCourse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/minigolf/holes:
    get:
      operationId: listMinigolfHoles
      summary: The hole library, newest edit first, with how many courses use each one (admin)
      tags: [minigolf]
      parameters:
        - name: search
          in: query
          required: false
          description: Filter by name, case-insensitive
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: The holes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfHoleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createMinigolfHole
      summary: A new hole, draft only, as given or a copy of another (admin)
      tags: [minigolf]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MinigolfHoleCreate' }
      responses:
        '201':
          description: The new hole
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfHoleRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/minigolf/holes/{id}:
    parameters:
      - $ref: '#/components/parameters/MinigolfHoleId'
    get:
      operationId: getMinigolfHole
      summary: A hole (admin)
      tags: [minigolf]
      responses:
        '200':
          description: The hole
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfHoleRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: saveMinigolfHole
      summary: Overwrite the draft if `version` is still current (admin)
      tags: [minigolf]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MinigolfHoleSave' }
      responses:
        '200':
          description: The saved hole
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinigolfHoleRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteMinigolfHole
      summary: Delete a hole; refused while a course (draft or published) uses it (admin)
      tags: [minigolf]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: better-auth session cookie, set by signing in via /api/auth

  parameters:
    BoardId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    GameId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    LobbyId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    InviteId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VoicePackId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    LobbyCode:
      name: code
      in: path
      required: true
      description: Lobby code; case, dashes and spaces are ignored
      schema: { type: string, minLength: 1, maxLength: 16 }
    FriendRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    FriendUserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MinigolfCourseId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MinigolfHoleId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AdminUserId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    FlagKey:
      name: key
      in: path
      required: true
      schema: { type: string, minLength: 1 }

  responses:
    BadRequest:
      description: The request doesn't match the spec
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The resource belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BoardError:
      description: Board Manager rejected the request or failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BoardUnavailable:
      description: The board is offline or unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BoardActionDone:
      description: Board Manager accepted the command
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BoardActionResult' }
    LobbyConflict:
      description: Conflicts with the lobby's state (see code)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LobbyConflict' }
    VoiceLimit:
      description: The pack doesn't fit the user's voice storage limit, imports are turned off, or the upload is too large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'Voice storage limit reached: 10.0 of 50 MB used, this pack needs 45.2 MB' }
    UnsupportedMediaType:
      description: The body isn't of the content type the operation takes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ImportRunning:
      description: The user already has an import running, the server is running as many as it takes, or the rate limit was exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FriendConflict:
      description: Already friends, or a request is already pending
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FriendConflict' }
    MinigolfPublishRefused:
      description: The course has no holes, or a hole in it fails a check that blocks Publish
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MinigolfPublishRefusal' }
    LastAdminConflict:
      description: Would leave no user with the admin role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: 'There must be at least one admin' }

  schemas:
    Player: { $ref: 'common-v1.json#/$defs/Player' }
    Dart: { $ref: 'common-v1.json#/$defs/Dart' }
    ErrorResponse: { $ref: 'common-v1.json#/$defs/ErrorResponse' }

    Segment: { $ref: 'common-v1.json#/$defs/Segment' }
    TeamView: { $ref: 'common-v1.json#/$defs/TeamView' }

    FriendList: { $ref: 'common-v1.json#/$defs/FriendList' }
    Avatar: { $ref: 'common-v1.json#/$defs/Avatar' }
    AvatarChoice: { $ref: 'common-v1.json#/$defs/AvatarChoice' }
    FriendRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 'Their exact name, any case; a leading @ is fine' }
    FriendRequestResult:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, accepted], description: 'accepted: they had asked you first, so you are friends now' }
    FriendConflict:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
        code: { type: string, enum: [already_friends, already_requested] }

    RankedMode: { type: string, enum: ['1v1', '2v2'] }
    RankedRating:
      type: object
      required: [mode, rating, rankIndex, matches, wins, streak, change30d]
      additionalProperties: false
      properties:
        mode: { $ref: '#/components/schemas/RankedMode' }
        rating:
          type: integer
          minimum: 0
          nullable: true
          description: 'Rating points (RP); null (hidden) during the placement matches'
        rankIndex:
          type: integer
          minimum: 0
          maximum: 29
          nullable: true
          description: 'The stage held, 0 (Wood I) to 29 (Elite V); null during the placement matches'
        matches: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        streak: { type: integer, description: 'Positive: wins in a row; negative: losses in a row' }
        change30d: { type: integer, description: 'RP gained (or lost) in the last 30 days, placement matches left out' }
    RankedOpponent:
      type: object
      required: [userId, name, rating, avatar]
      additionalProperties: false
      properties:
        userId: { type: string }
        name: { type: string }
        rating: { type: integer, nullable: true, description: 'Their rating going into the game; null while they were placing' }
        avatar: { $ref: '#/components/schemas/Avatar' }
    RankedGame:
      type: object
      required: [sessionId, mode, won, change, at, opponents]
      additionalProperties: false
      properties:
        sessionId: { type: string }
        mode: { $ref: '#/components/schemas/RankedMode' }
        won: { type: boolean }
        change: { type: integer, nullable: true, description: 'RP the game moved your rating by; null for a placement match' }
        at: { type: string, format: date-time }
        opponents: { type: array, items: { $ref: '#/components/schemas/RankedOpponent' } }
    RankedProfile:
      type: object
      required: [ratings, onlineAverage, recent]
      additionalProperties: false
      properties:
        ratings:
          type: array
          description: One per mode, 1v1 first
          items: { $ref: '#/components/schemas/RankedRating' }
        onlineAverage: { type: number, nullable: true, description: '3-dart average over the last 20 ranked games; null before the first' }
        recent: { type: array, description: 'Last ranked games, newest first', items: { $ref: '#/components/schemas/RankedGame' } }

    HistoryDart:
      type: object
      required: [index, segment, coords, source, corrected, thrownAt]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0, maximum: 2, description: Position in the visit }
        segment: { $ref: '#/components/schemas/Segment' }
        coords:
          type: object
          nullable: true
          required: [x, y]
          additionalProperties: false
          description: Normalised board position (r = 1 at the outer double wire); null for a manual dart without one
          properties:
            x: { type: number }
            y: { type: number }
        source: { type: string, enum: [camera, manual] }
        corrected: { type: boolean, description: A correction (camera or by hand) changed this dart }
        thrownAt: { type: string, format: date-time }
    X01Detail:
      type: object
      required: [mode, legs]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [x01] }
        teams:
          type: array
          description: Only in a team game
          items: { $ref: '#/components/schemas/TeamView' }
        legs:
          type: array
          items:
            type: object
            required: [leg, starter, winner, visits]
            additionalProperties: false
            properties:
              leg: { type: integer, minimum: 0 }
              starter: { type: integer, minimum: 0, description: Seat that threw first in this leg }
              winner: { type: integer, minimum: 0, nullable: true, description: 'null: the leg was cut short by the round limit' }
              visits:
                type: array
                items:
                  type: object
                  required: [visit, seat, committedAt, darts, scored, remaining, bust]
                  additionalProperties: false
                  properties:
                    visit: { type: integer, minimum: 0 }
                    seat: { type: integer, minimum: 0 }
                    committedAt: { type: string, format: date-time }
                    darts: { type: array, items: { $ref: '#/components/schemas/HistoryDart' } }
                    scored: { type: integer, minimum: 0 }
                    remaining: { type: integer, minimum: 0 }
                    bust: { type: boolean }
    OfrepRequest:
      type: object
      description: OFREP's request body. Its context is accepted and ignored.
      properties:
        context: { type: object, additionalProperties: true }
    OfrepEvaluation:
      type: object
      required: [key, value, reason, variant]
      additionalProperties: false
      properties:
        key: { type: string }
        value:
          description: On/off for most flags; a number for number flags (matchmaking.visitSeconds)
          anyOf: [{ type: boolean }, { type: number }]
        reason: { type: string, description: 'OpenFeature resolution reason, e.g. TARGETING_MATCH' }
        variant: { type: string }
    OfrepBulkResponse:
      type: object
      required: [flags]
      additionalProperties: false
      properties:
        flags: { type: array, items: { $ref: '#/components/schemas/OfrepEvaluation' } }
    OfrepFailure:
      type: object
      required: [key, errorCode]
      additionalProperties: false
      properties:
        key: { type: string }
        errorCode: { type: string, enum: [FLAG_NOT_FOUND] }
    MinigolfDetail:
      type: object
      required: [mode, course, holes, scores]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [minigolf] }
        course: { type: string, description: 'The course name ("Mixed course" for random holes)' }
        holes:
          type: array
          description: The holes in the order played
          items:
            type: object
            required: [name, par]
            additionalProperties: false
            properties:
              name: { type: string }
              par: { type: integer, minimum: 1 }
        scores:
          type: array
          description: 'Strokes per hole (in hole order), then per seat; null for a hole not finished'
          items: { type: array, items: { type: integer, minimum: 1, nullable: true } }
    P121Detail:
      type: object
      required: [mode, seats]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [p121] }
        seats:
          type: array
          description: One per seat, in seat order
          items:
            type: object
            required: [tries, doubles, dartsPerCheckout, bestRun, highestReached, fastest]
            additionalProperties: false
            properties:
              tries:
                type: array
                items:
                  type: object
                  required: [target, made, darts, finish]
                  additionalProperties: false
                  properties:
                    target: { type: integer }
                    made: { type: boolean }
                    darts: { type: integer, minimum: 0 }
                    finish: { type: string, nullable: true }
              doubles:
                type: array
                description: Finishing darts with attempts, most attempted first
                items:
                  type: object
                  required: [label, hits, attempts]
                  additionalProperties: false
                  properties:
                    label: { type: string }
                    hits: { type: integer, minimum: 0 }
                    attempts: { type: integer, minimum: 0 }
              dartsPerCheckout:
                type: array
                description: Made tries by darts used, ascending
                items:
                  type: object
                  required: [darts, count]
                  additionalProperties: false
                  properties:
                    darts: { type: integer, minimum: 1 }
                    count: { type: integer, minimum: 1 }
              bestRun:
                type: object
                nullable: true
                description: 'The longest run of consecutive made tries; null without one'
                required: [length, from, to]
                additionalProperties: false
                properties:
                  length: { type: integer, minimum: 1 }
                  from: { type: integer }
                  to: { type: integer }
              highestReached: { type: integer }
              fastest:
                type: object
                nullable: true
                description: 'The made try with the fewest darts; null without a made try'
                required: [darts, target]
                additionalProperties: false
                properties:
                  darts: { type: integer }
                  target: { type: integer }
    HiloDetail:
      type: object
      required: [mode, start, visits, seats]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [hilo] }
        start:
          type: object
          description: The bars the game started with
          required: [high, low]
          additionalProperties: false
          properties:
            high: { type: integer, minimum: 0, maximum: 180 }
            low: { type: integer, minimum: 0, maximum: 180 }
        visits:
          type: array
          description: Every visit of the game, in order
          items:
            type: object
            required: [seat, round, total, outcome, high, low]
            additionalProperties: false
            properties:
              seat: { type: integer, minimum: 0 }
              round: { type: integer, minimum: 1 }
              total: { type: integer, minimum: 0 }
              outcome: { type: string, enum: [high, low, between, miss] }
              high: { type: integer, minimum: 0, maximum: 180, description: The high bar after this visit }
              low: { type: integer, minimum: 0, maximum: 180, description: The low bar after this visit }
        seats:
          type: array
          description: One per seat, in seat order
          items:
            type: object
            required: [place, outRound, livesLeft]
            additionalProperties: false
            properties:
              place: { type: integer, minimum: 1 }
              outRound: { type: integer, minimum: 1, nullable: true, description: The round the seat went out in; null while still in }
              livesLeft: { type: integer, minimum: 0 }
    AtcDetail:
      type: object
      required: [mode, visits, progress, sequence]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [atc] }
        sequence:
          type: array
          description: Every target in order, 1–20, 21 = 25, 22 = bull
          items: { type: integer }
        visits:
          type: array
          items:
            type: object
            required: [visit, seat, committedAt, darts, hits, targetBefore, targetAfter]
            additionalProperties: false
            properties:
              visit: { type: integer, minimum: 0 }
              seat: { type: integer, minimum: 0 }
              committedAt: { type: string, format: date-time }
              darts: { type: array, items: { $ref: '#/components/schemas/HistoryDart' } }
              hits: { type: integer, minimum: 0, maximum: 3 }
              targetBefore: { type: integer, description: 'Target at the start of the visit (1–20, 21 = 25, 22 = bull)' }
              targetAfter: { type: integer, description: Target after the visit; past the last target means finished }
        progress:
          type: array
          description: One per seat, in seat order. Every target the seat got to, in order.
          items:
            type: object
            required: [seat, steps]
            additionalProperties: false
            properties:
              seat: { type: integer, minimum: 0 }
              steps:
                type: array
                items:
                  type: object
                  required: [target, darts, hit]
                  additionalProperties: false
                  properties:
                    target: { type: integer, description: '1–20, 21 = 25, 22 = bull' }
                    darts: { type: integer, minimum: 0, description: 'Darts thrown at it; 0 when a multiplier skipped it' }
                    hit: { type: boolean, description: 'Completed; false only for the target the game ended on' }

    Health:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }

    PreviewInfo:
      type: object
      required: [preview]
      additionalProperties: false
      properties:
        preview:
          type: object
          nullable: true
          required: [pr, url]
          additionalProperties: false
          description: The pull request this deployment previews; null in production
          properties:
            pr: { type: integer, minimum: 1 }
            url: { type: string, format: uri, description: The pull request on GitHub }

    BuildInfo:
      type: object
      required: [version, commit, buildTime]
      additionalProperties: false
      properties:
        version: { type: string, description: 'The release tag (v0.3.0), pr-<n> on a preview, dev otherwise' }
        commit: { type: string, nullable: true, description: The git commit the image was built from }
        buildTime: { type: string, nullable: true, description: 'When the image was built (ISO 8601)' }

    AdminSystem:
      type: object
      required: [build, runtime, database, live, config]
      additionalProperties: false
      properties:
        build:
          type: object
          required: [version, commit, buildTime, preview]
          additionalProperties: false
          properties:
            version: { type: string }
            commit: { type: string, nullable: true }
            buildTime: { type: string, nullable: true }
            preview:
              type: object
              nullable: true
              required: [pr, url]
              additionalProperties: false
              description: The pull request this deployment previews; null in production
              properties:
                pr: { type: integer, minimum: 1 }
                url: { type: string, format: uri }
        runtime:
          type: object
          required: [node, platform, arch, hostname, timezone, nodeEnv, startedAt, uptimeSeconds, memory, eventLoopDelayMs]
          additionalProperties: false
          properties:
            node: { type: string }
            platform: { type: string }
            arch: { type: string }
            hostname: { type: string }
            timezone: { type: string }
            nodeEnv: { type: string, nullable: true }
            startedAt: { type: string, format: date-time }
            uptimeSeconds: { type: number }
            memory:
              type: object
              required: [rss, heapUsed, heapTotal]
              additionalProperties: false
              description: Bytes
              properties:
                rss: { type: number }
                heapUsed: { type: number }
                heapTotal: { type: number }
            eventLoopDelayMs:
              type: object
              required: [p50, p99]
              additionalProperties: false
              description: Since the last read
              properties:
                p50: { type: number }
                p99: { type: number }
        database:
          type: object
          required: [serverVersion, latestMigration, sizeBytes, pool]
          additionalProperties: false
          properties:
            serverVersion: { type: string }
            latestMigration: { type: string, nullable: true }
            sizeBytes: { type: number }
            pool:
              type: object
              nullable: true
              required: [total, idle, waiting]
              additionalProperties: false
              properties:
                total: { type: integer }
                idle: { type: integer }
                waiting: { type: integer }
        live:
          type: object
          required: [browsers, bridges, boardsOnline, runningGames, openLobbies]
          additionalProperties: false
          properties:
            browsers: { type: integer, description: 'Open browser sockets: games, lobbies and /ws/me' }
            bridges: { type: integer, description: Connected bridge sockets }
            boardsOnline: { type: integer }
            runningGames: { type: integer }
            openLobbies: { type: integer }
        config:
          type: object
          required: [values, secrets]
          additionalProperties: false
          properties:
            values:
              type: object
              description: Non-secret environment variables as set (null when unset)
              additionalProperties: { type: string, nullable: true }
            secrets:
              type: object
              description: Whether each secret environment variable is set; never its value
              additionalProperties: { type: boolean }

    AuthInfo:
      type: object
      required: [mail, verification, contactEmail]
      additionalProperties: false
      properties:
        mail: { type: boolean, description: Password reset and mailed confirmations are available }
        verification: { type: boolean, description: New accounts confirm their email before signing in }
        contactEmail: { type: string, nullable: true, description: Where to reach the operator (LEGAL_CONTACT_EMAIL; null when not set) }

    LegalDoc:
      type: object
      required: [html, updated]
      additionalProperties: false
      properties:
        html: { type: string }
        updated: { type: string, nullable: true, description: When the text last changed (LEGAL_UPDATED) }

    ConfigFieldMeta:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string }
        tooltip: { type: string }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            additionalProperties: false
            properties:
              value:
                anyOf:
                  - { type: string }
                  - { type: number }
                  - { type: boolean }
              label: { type: string }
    GameInfo:
      type: object
      required: [id, defaultConfig, configMeta, teams, supportsBots]
      additionalProperties: false
      properties:
        id: { type: string }
        defaultConfig: { type: object, additionalProperties: true }
        configMeta:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ConfigFieldMeta' }
        teams: { type: boolean, description: 'The game can be played in teams (its config takes format and teams)' }
        supportsBots: { type: boolean, description: 'The game can seat a bot (its module defines botTarget)' }
    GameModeList:
      type: object
      required: [modes]
      additionalProperties: false
      properties:
        modes:
          type: array
          items: { $ref: '#/components/schemas/GameInfo' }

    GameSeat:
      type: object
      required: [seat, name, userId, avatar, bot, placement, throwPosition, stats, forfeited]
      additionalProperties: false
      properties:
        seat: { type: integer, minimum: 0 }
        throwPosition:
          {
            type: integer,
            minimum: 0,
            nullable: true,
            description: 'Where the seat threw in the game (0 = first; a bull off can change it from the seat order). null for games finished before it was recorded',
          }
        name: { type: string }
        userId:
          {
            type: string,
            nullable: true,
            description: "The seat's account; null for guests and bots, and for everyone when viewing a public game you didn't play in",
          }
        avatar: { $ref: '#/components/schemas/Avatar' }
        bot:
          type: object
          nullable: true
          required: [level]
          additionalProperties: false
          properties:
            level: { type: integer, minimum: 1, maximum: 10 }
          description: "A bot's difficulty 1-10; null for a member or guest."
        placement: { type: integer, minimum: 1 }
        stats:
          type: object
          additionalProperties: { type: number }
          description: Per game mode, e.g. X01 average, dartsThrown, legsWon, pointsScored; ATC dartsThrown, targetsHit
        forfeited:
          type: boolean
          description: The seat gave up (abandoned) the game; placed last.
    GameSummary:
      type: object
      required: [id, mode, config, createdAt, finishedAt, board, mySeat, invalidated, players]
      additionalProperties: false
      properties:
        id: { type: string }
        mode: { type: string }
        config: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        board:
          type: object
          nullable: true
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
        mySeat: { type: integer, minimum: 0, nullable: true }
        invalidated:
          { type: boolean, description: A moderator invalidated the game; it stays in the history but does not count in stats or ratings }
        players:
          type: array
          items: { $ref: '#/components/schemas/GameSeat' }
    GameList:
      type: object
      required: [games, nextCursor]
      additionalProperties: false
      properties:
        games:
          type: array
          items: { $ref: '#/components/schemas/GameSummary' }
        nextCursor: { type: string, nullable: true }
    AdminGameSeat:
      type: object
      required: [seat, name, userId, bot, placement, forfeited]
      additionalProperties: false
      properties:
        seat: { type: integer, minimum: 0 }
        name: { type: string }
        userId: { type: string, nullable: true, description: The seat's account; null for guests and bots }
        bot:
          type: object
          nullable: true
          required: [level]
          additionalProperties: false
          properties:
            level: { type: integer }
        placement: { type: integer, nullable: true, description: null while the game has no result }
        forfeited: { type: boolean }
    AdminGameInvalidation:
      type: object
      nullable: true
      description: Set once a moderator invalidated the game
      required: [at, by, reason]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        by:
          type: object
          nullable: true
          description: The moderator; null once their account is gone
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
        reason: { type: string, nullable: true, description: "Why, in the moderator's words; null when none was given" }
    AdminGameSummary:
      type: object
      required: [id, mode, status, config, createdAt, finishedAt, board, ranked, invalidated, players]
      additionalProperties: false
      properties:
        id: { type: string }
        mode: { type: string }
        status: { type: string, enum: [finished, aborted, active] }
        config: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        board:
          type: object
          nullable: true
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
        ranked: { type: boolean, description: The game moved ranked ratings }
        invalidated: { $ref: '#/components/schemas/AdminGameInvalidation' }
        players:
          type: array
          items: { $ref: '#/components/schemas/AdminGameSeat' }
    InvalidateGameRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, description: 'Why the game is invalidated; optional, blank counts as none' }
    AdminGameRecalculated:
      type: object
      required: [recalculated]
      additionalProperties: false
      properties:
        recalculated:
          type: array
          description: The ranked modes whose ratings were replayed (without the game when it was invalidated, with it when restored)
          items: { type: string, enum: ['1v1', '2v2'] }
    AdminGameList:
      type: object
      required: [games, nextCursor]
      additionalProperties: false
      properties:
        games:
          type: array
          items: { $ref: '#/components/schemas/AdminGameSummary' }
        nextCursor: { type: string, nullable: true }
    StatAggregate:
      type: object
      required: [avg, min, max, sum, previousAvg]
      additionalProperties: false
      properties:
        avg: { type: number }
        sum: { type: number }
        min: { type: number }
        max: { type: number }
        previousAvg: { type: number, nullable: true, description: Average over the period before; null without games then }
    ModeStats:
      type: object
      required: [matches, wins, contested, stats]
      additionalProperties: false
      properties:
        matches: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        contested: { type: integer, minimum: 0, description: Games with two or more seats }
        stats:
          type: object
          additionalProperties: { $ref: '#/components/schemas/StatAggregate' }
    GameStats:
      type: object
      required: [days, matches, wins, contested, modes]
      additionalProperties: false
      properties:
        days: { type: integer, minimum: 1 }
        matches: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0, description: 1st place in a contested game }
        contested: { type: integer, minimum: 0, description: Games with two or more seats; win rate = wins / contested }
        modes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ModeStats' }
    BestStat:
      type: object
      required: [best]
      additionalProperties: false
      properties:
        best:
          type: object
          nullable: true
          description: 'null when the user has no finished game of the mode with that stat'
          required: [value, finishedAt]
          additionalProperties: false
          properties:
            value: { type: number }
            finishedAt: { type: string, format: date-time }
    GameDetail:
      type: object
      required: [game, detail, stats]
      additionalProperties: false
      properties:
        game: { $ref: '#/components/schemas/GameSummary' }
        detail:
          oneOf:
            - $ref: '#/components/schemas/X01Detail'
            - $ref: '#/components/schemas/AtcDetail'
            - $ref: '#/components/schemas/MinigolfDetail'
            - $ref: '#/components/schemas/P121Detail'
            - $ref: '#/components/schemas/HiloDetail'
          discriminator:
            propertyName: mode
            mapping:
              x01: '#/components/schemas/X01Detail'
              atc: '#/components/schemas/AtcDetail'
              minigolf: '#/components/schemas/MinigolfDetail'
              p121: '#/components/schemas/P121Detail'
              hilo: '#/components/schemas/HiloDetail'
        stats: { $ref: '#/components/schemas/MatchStats' }
    AdminGameDetail:
      type: object
      required: [game, detail, stats, invalidated]
      additionalProperties: false
      properties:
        game: { $ref: '#/components/schemas/GameSummary' }
        detail: { $ref: '#/components/schemas/GameDetail/properties/detail' }
        stats: { $ref: '#/components/schemas/MatchStats' }
        invalidated: { $ref: '#/components/schemas/AdminGameInvalidation' }

    MatchStats:
      type: object
      description: The game's match stats, the same shape for every game mode. Rows say how to show each value, so a mode adds stats without a frontend change.
      required: [rows, seats]
      additionalProperties: false
      properties:
        rows:
          type: array
          description: In display order
          items: { $ref: '#/components/schemas/StatRow' }
        seats:
          type: array
          description: One per seat, in seat order
          items: { $ref: '#/components/schemas/StatValues' }
        teams:
          type: array
          description: Only in a team game; one per team. Seats keep their own values.
          items: { $ref: '#/components/schemas/StatValues' }
        legs:
          type: array
          description: The same stats per leg, in leg order; only for modes with legs (X01)
          items: { $ref: '#/components/schemas/LegStats' }

    LegStats:
      type: object
      description: One leg's stats, shaped like the match's
      required: [leg, rows, seats]
      additionalProperties: false
      properties:
        leg: { type: integer, minimum: 0 }
        rows:
          type: array
          description: In display order
          items: { $ref: '#/components/schemas/StatRow' }
        seats:
          type: array
          description: One per seat, in seat order
          items: { $ref: '#/components/schemas/StatValues' }
        teams:
          type: array
          description: Only in a team game; one per team
          items: { $ref: '#/components/schemas/StatValues' }

    StatValues:
      type: object
      description: 'seat or team (the index), and its values by key; a missing key means the stat does not apply'
      required: [index, values]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0 }
        values:
          type: object
          additionalProperties: { type: number }

    StatRow:
      type: object
      required: [key, label, format, better, compact]
      additionalProperties: false
      properties:
        key: { type: string, description: 'Names the row (e.g. first9Average); also the key of its value unless `value` says otherwise' }
        label: { type: string }
        format:
          type: string
          enum: [decimal, integer, darts, target, ratio]
          description: 'decimal 83.9, integer 6, darts "15 darts", target 1–20 / 21 = 25 / 22 = Bull, ratio "50% · 3/6"'
        value: { type: string, description: "The key holding the row's value (for a ratio, the numerator); default `key`" }
        of: { type: string, description: 'ratio only: the key of the denominator' }
        better:
          type: string
          enum: [higher, lower, null]
          nullable: true
          description: null when no side is better (e.g. darts thrown)
        compact: { type: boolean, description: 'Also shown where space is short (party standings, phone)' }

    Board:
      type: object
      required: [id, name, hardwareId, online, bridgeVersion, bmVersion, createdAt, ip, bmUrl, bridgeUpdate]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        hardwareId: { type: string, nullable: true }
        online: { type: boolean }
        bridgeVersion: { type: string, nullable: true, description: 'Bridge build, e.g. v0.4.2 or dev+b503493-dirty' }
        bmVersion: { type: string, nullable: true, description: Board Manager version }
        createdAt: { type: string, format: date-time, description: When the board was paired }
        ip: { type: string, nullable: true, description: Board Manager host name }
        bmUrl: { type: string, nullable: true, description: 'Board Manager origin incl. port, e.g. http://192.168.0.109:3180' }
        bridgeUpdate: { $ref: '#/components/schemas/BridgeUpdate' }
    BridgeUpdate:
      type: object
      required: [available, updatable]
      additionalProperties: false
      properties:
        available:
          type: string
          nullable: true
          description: "The release this server offers when it is newer than the bridge, e.g. v0.9.2 (never a major above the server's own; a 0.x server also keeps the minor)"
        updatable: { type: boolean, description: 'The bridge can update itself: it runs as an installed service' }
        status: { $ref: '#/components/schemas/BridgeUpdateStatus' }
    BridgeUpdateStatus:
      description: The last update asked for since the server started (absent when none)
      type: object
      required: [version, phase, error]
      additionalProperties: false
      properties:
        version: { type: string }
        phase:
          type: string
          enum: [requested, downloading, verifying, installing, restarting, done, failed]
          description: 'done: the bridge came back with the new version. failed: the old bridge keeps running (error says why)'
        error: { type: string, nullable: true }
    BoardList:
      type: object
      required: [boards]
      additionalProperties: false
      properties:
        boards:
          type: array
          items: { $ref: '#/components/schemas/Board' }
    CreateBoardRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 64 }
    CreatedBoard:
      type: object
      required: [id, name, token]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        token: { type: string, description: Bridge token; shown only once }
    RenameBoardRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 64 }
    RenamedBoard:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
    BoardStatus:
      type: object
      required: [status, running, event]
      additionalProperties: false
      properties:
        status: { type: string, nullable: true }
        running: { type: boolean }
        event: { type: string, nullable: true }
    BoardEvent:
      type: object
      required: [at, kind, data]
      additionalProperties: false
      properties:
        at: { type: string, description: When the bridge received it (ISO timestamp) }
        kind: { type: string, enum: [dart.detected, dart.corrected, takeout.started, visit.cleared] }
        data:
          type: object
          additionalProperties: true
          properties:
            dart: { $ref: '#/components/schemas/Dart' }
    BoardEventList:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/BoardEvent' }
    BoardActionResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: integer, description: HTTP status Board Manager answered with }

    WledDevice:
      type: object
      required: [id, mac, name, host, leds, version, segments, segmentMode, maxBri, reachable]
      additionalProperties: false
      properties:
        id: { type: string }
        mac: { type: string }
        name: { type: string }
        host: { type: string }
        leds: { type: integer }
        version: { type: string }
        segments: { type: integer }
        segmentMode: { type: string, enum: [whole, perSeat, wled] }
        maxBri: { type: integer }
        reachable: { type: boolean, nullable: true, description: 'null until the bridge has sent to it' }
        error: { type: string }
        since: { type: string, format: date-time }
    FoundWledDevice:
      type: object
      required: [mac, host, name, leds, version, segments]
      additionalProperties: false
      properties:
        mac: { type: string }
        host: { type: string }
        name: { type: string }
        leds: { type: integer }
        version: { type: string }
        segments: { type: integer }
        onBoard: { type: string, description: Name of another of your boards this device is paired to }
    LightRule:
      type: object
      required: [when, type, look]
      additionalProperties: false
      properties:
        when:
          type: object
          required: [trigger, seats]
          additionalProperties: false
          properties:
            trigger: { type: string }
            seats: { type: string, enum: [any, mine, other] }
            total:
              type: object
              required: [op, n]
              additionalProperties: false
              properties:
                op: { type: string, enum: ['=', '>='] }
                n: { type: integer }
            game: { type: string }
        type: { type: string, enum: [scene, flash] }
        look:
          description: A computed colour/effect look, or the user's own WLED preset state sent back verbatim
          oneOf:
            - type: object
              required: [color, fx, bri]
              additionalProperties: false
              properties:
                color: { type: string }
                fx: { type: integer }
                bri: { type: integer }
                speed: { type: integer }
            - type: object
              required: [preset, state]
              additionalProperties: false
              properties:
                preset: { type: string }
                state: { type: object, additionalProperties: true }
        holdMs: { type: integer }
    LightProfile:
      type: object
      required: [id, name, builtIn, rules]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        builtIn: { type: boolean }
        rules:
          type: array
          items: { $ref: '#/components/schemas/LightRule' }
    BoardLights:
      type: object
      required: [enabled, bridgeOnline, bridgeOutdated, devices, found, lastScanAt, probe, profile, scanError]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        bridgeOnline: { type: boolean }
        bridgeOutdated: { type: boolean }
        devices:
          type: array
          items: { $ref: '#/components/schemas/WledDevice' }
        found:
          type: array
          items: { $ref: '#/components/schemas/FoundWledDevice' }
        lastScanAt: { type: string, format: date-time, nullable: true }
        probe:
          type: object
          nullable: true
          required: [host]
          additionalProperties: false
          properties:
            host: { type: string }
            error: { type: string }
        profile: { $ref: '#/components/schemas/LightProfile' }
        scanError: { type: string, nullable: true, description: "The board's bridge couldn't complete its last scan" }

    PairingCode:
      type: object
      required: [code, expiresAt]
      additionalProperties: false
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
    PairingTokenStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending, claimed, consumed] }
        token: { type: string, description: Present only when status is claimed }
    ClaimPairingRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '\S', maxLength: 32 }
        name: { type: string, pattern: '\S', maxLength: 64 }
    ClaimedBoard:
      type: object
      required: [boardId, name]
      additionalProperties: false
      properties:
        boardId: { type: string }
        name: { type: string }

    BridgeInstallToken:
      type: object
      required: [token, expiresAt]
      additionalProperties: false
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    SessionSummary:
      type: object
      required: [id, boardId, gameId, status, players, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        boardId: { type: string, nullable: true }
        gameId: { type: string }
        status: { type: string, enum: [active, finished] }
        players:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        createdAt: { type: string, format: date-time }
    SessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }
    SessionDetail:
      type: object
      required: [id, boardId, gameId, status, players, createdAt, game]
      additionalProperties: false
      properties:
        id: { type: string }
        boardId: { type: string, nullable: true }
        gameId: { type: string }
        status: { type: string, enum: [active, finished] }
        players:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        createdAt: { type: string, format: date-time }
        game:
          type: object
          nullable: true
          additionalProperties: true
          description: Current game state; its shape is specified by schema/game-ws-v1.json
    CreateSessionRequest:
      type: object
      required: [gameId, config, players]
      additionalProperties: false
      properties:
        boardId: { type: string, nullable: true, description: 'null or absent: manual entry without a board' }
        gameId: { type: string }
        config: { type: object, additionalProperties: true }
        players:
          type: array
          minItems: 1
          maxItems: 16
          description: The first player is the signed-in user; the others are guests at the same board
          items: { $ref: '#/components/schemas/SeatRequest' }
    SeatRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32, description: 'As long as a guest name may be (AddGuestRequest)' }
    UserSummary:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
    UserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
    AdminUser:
      type: object
      required: [id, name, email, emailVerified, role, createdAt, lastLoginAt, avatar]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        role: { type: string, nullable: true, enum: [admin, moderator, null] }
        createdAt: { type: string, format: date-time, description: When the account was made }
        lastLoginAt: { type: string, format: date-time, nullable: true, description: Last sign-in; null if never }
        avatar: { $ref: '#/components/schemas/Avatar' }
    AdminUserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
    SetUserRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          nullable: true
          enum: [admin, moderator, null]
          description: 'The role to give: admin (everything), moderator (look at and invalidate games), or null for none'
    SetUserVerifiedRequest:
      type: object
      required: [verified]
      additionalProperties: false
      properties:
        verified: { type: boolean, description: "true: mark the account's email verified; false: unverified" }
    FlagRange:
      type: array
      description: '[min, max], number flags only'
      items: { type: number }
      minItems: 2
      maxItems: 2
    FlagDefault:
      type: object
      description: "The flag's behaviour without a stored override"
      additionalProperties: false
      properties:
        rule: { type: string, enum: [admins, nobody], description: "Boolean flags only: who it's on for without FLAGS_ON" }
        envOn: { type: boolean, description: 'Boolean flags only: turned on for everyone by FLAGS_ON' }
        envValue: { type: number, description: 'Number flags only: set for this deployment by FLAG_VALUES' }
        value: { type: number, description: 'Number flags only: the code default, used without FLAG_VALUES' }
    AdminFlag:
      type: object
      required: [key, kind, description, default, override, value]
      additionalProperties: false
      properties:
        key: { type: string }
        kind: { type: string, enum: [boolean, number] }
        description: { type: string }
        range: { $ref: '#/components/schemas/FlagRange' }
        default: { $ref: '#/components/schemas/FlagDefault' }
        override:
          type: object
          nullable: true
          description: 'A stored override, or null for default behaviour'
          required: [updatedBy, updatedAt]
          additionalProperties: false
          properties:
            mode: { type: string, enum: [off, admins, users, on] }
            users:
              type: array
              description: "Only for mode 'users'"
              items:
                type: object
                required: [id, name]
                additionalProperties: false
                properties:
                  id: { type: string }
                  name: { type: string, nullable: true, description: 'null when the account no longer exists' }
            number: { type: number }
            updatedBy:
              type: object
              nullable: true
              required: [id, name]
              additionalProperties: false
              properties:
                id: { type: string }
                name: { type: string, nullable: true, description: 'null when the account no longer exists' }
            updatedAt: { type: string, format: date-time }
        value:
          description: "The flag's value for you, right now"
          oneOf:
            - { type: boolean }
            - { type: number }
    AdminFlagList:
      type: object
      required: [flags, stale]
      additionalProperties: false
      properties:
        flags:
          type: array
          items: { $ref: '#/components/schemas/AdminFlag' }
        stale:
          type: array
          description: "Override rows whose key isn't a flag any more"
          items:
            type: object
            required: [key, updatedAt]
            additionalProperties: false
            properties:
              key: { type: string }
              updatedAt: { type: string, format: date-time }
    SetFlagOverrideRequest:
      type: object
      description: A mode (on/off flags) or a number (number flags)
      oneOf:
        - type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode: { type: string, enum: [off, admins, users, on] }
            userIds: { type: array, items: { type: string }, description: "Only read for mode 'users'; unknown ids are dropped" }
        - type: object
          required: [number]
          additionalProperties: false
          properties:
            number: { type: number }
    Me:
      type: object
      required: [id, name, email, nameNeedsChange, suggestedName, invisible, isAdmin, isModerator, createdAt, avatar, pictures]
      additionalProperties: false
      properties:
        pictures:
          type: array
          items: { type: string }
          description: 'The avatar presets you may wear (progression rewards)'
        id: { type: string }
        name: { type: string, description: 'Your handle, shown as @name' }
        email: { type: string }
        nameNeedsChange:
          {
            type: boolean,
            description: 'Your name broke the rules or duplicated an older one when names became unique: pick a new one first',
          }
        suggestedName: { type: string, nullable: true, description: 'A free name close to yours, while nameNeedsChange' }
        invisible: { type: boolean, description: 'Friends see you as offline' }
        isAdmin: { type: boolean, description: 'May open admin pages (the minigolf test bench)' }
        isModerator: { type: boolean, description: 'May look at any game and invalidate it (admins and moderators)' }
        createdAt: { type: string, format: date-time, description: 'When the account was made (Member since)' }
        avatar: { $ref: '#/components/schemas/Avatar' }
    UpdateMeRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        invisible: { type: boolean }
        avatar: { $ref: '#/components/schemas/AvatarChoice' }
    Preferences:
      type: object
      additionalProperties: false
      description: "Account-wide settings (Settings: Game preferences, Caller). Volume and the match screen's view stay on each device."
      properties:
        checkoutSuggestions: { type: boolean }
        visitSum: { type: boolean }
        chalkboard: { type: boolean }
        showMarkers: { type: boolean, description: "Around the Clock: other players' targets on the board" }
        soundHit: { type: boolean }
        soundTreble: { type: boolean, description: 'Trebles get their own sound; off: they play the hit sound' }
        soundMiss: { type: boolean }
        soundSwitch: { type: boolean }
        soundBust: { type: boolean }
        soundWin: { type: boolean }
        soundPack:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            nullable: true,
            description: "A sound pack perk id that plays for every dart on your screen; null: each thrower's own",
          }
        callerOn: { type: boolean, description: 'The caller is on in new games' }
        callerVoice:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            nullable: true,
            description: 'A voice pack id or builtin:<id>; null: the default voice',
          }
        callerCheckouts: { type: boolean, description: 'X01: the caller says "You require N" when the next thrower can finish' }
        callerCheckoutRepeat: { type: boolean, description: 'The checkout call is said again while the score stays the same' }
        x01StartScore: { type: integer, enum: [301, 501, 701], description: 'New game defaults: X01 start score' }
        x01OutMode: { type: string, enum: [straight, double, master], description: 'New game defaults: X01 check-out' }
        x01FirstTo: { type: integer, minimum: 1, maximum: 99, description: 'New game defaults: X01 legs to win' }
        x01BullOff: { type: string, enum: ['off', wdc, pdc], description: 'New game defaults: X01 throw order (off: lobby order)' }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: 'IANA time zone the day streak and daily limits count days in' }
        equipped:
          type: object
          description: 'The perks worn on the profile card; read-only here, set through PUT /api/progress/equip'
          additionalProperties: false
          properties:
            title: { type: string }
            banner: { type: string }
            colors: { type: string }
            frame: { type: string }
            name: { type: string }
            sound: { type: string }
            celebration: { type: string }
    Progress:
      type: object
      required: [xp, level, streak, challengesToClaim, perks]
      additionalProperties: false
      properties:
        xp: { type: integer, minimum: 0, description: Total XP }
        level: { type: integer, minimum: 1 }
        streak: { $ref: '#/components/schemas/DayStreak' }
        challengesToClaim:
          { type: integer, minimum: 0, description: "Daily and weekly challenges finished but not claimed yet (the nav's count)" }
        perks: { $ref: '#/components/schemas/Perks' }
    Equipped:
      type: object
      description: "The card's perk of each kind (shared/progression.ts PERKS ids); the picture is the avatar"
      required: [title, banner, colors, frame, name, sound, celebration]
      additionalProperties: false
      properties:
        title: { type: string }
        banner: { type: string }
        colors: { type: string }
        frame: { type: string, description: 'The frame round the picture' }
        name: { type: string, description: "The name's style" }
        sound: { type: string, description: 'The sound pack your darts play on the match screen' }
        celebration: { type: string, description: 'What plays on the win screen when you win' }
    Perks:
      type: object
      required: [unlocked, equipped]
      additionalProperties: false
      properties:
        unlocked: { type: array, items: { type: string }, description: 'Perk ids unlocked, the level 1 ones included' }
        equipped: { $ref: '#/components/schemas/Equipped' }
    EquipRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 64 }
        banner: { type: string, maxLength: 64 }
        colors: { type: string, maxLength: 64 }
        frame: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 64 }
        sound: { type: string, maxLength: 64 }
        celebration: { type: string, maxLength: 64 }
    PlayerProfile:
      type: object
      required:
        [
          id,
          name,
          memberSince,
          relation,
          avatar,
          look,
          level,
          ranked,
          streak,
          average,
          favourite,
          matches,
          headToHead,
          playsMost,
          recent,
          xp,
          collection,
        ]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        memberSince: { type: string, format: date-time }
        relation: { type: string, enum: [self, friend, stranger] }
        avatar: { $ref: '#/components/schemas/Avatar' }
        look: { $ref: '#/components/schemas/Equipped' }
        level: { type: integer, minimum: 1 }
        ranked:
          type: array
          description: Both ranked modes; the rating hidden while placing
          items:
            type: object
            required: [mode, rankIndex, rating, matches, wins]
            additionalProperties: false
            properties:
              mode: { type: string, enum: ['1v1', '2v2'] }
              rankIndex: { type: integer, nullable: true }
              rating: { type: integer, nullable: true }
              matches: { type: integer, minimum: 0 }
              wins: { type: integer, minimum: 0 }
        streak: { type: integer, minimum: 0, nullable: true, description: 'Day streak; friends and yourself only' }
        average: { type: number, nullable: true, description: X01 3-dart average over the last 20 games }
        favourite: { type: string, nullable: true, description: The mode played most }
        matches: { type: integer, minimum: 0 }
        headToHead:
          type: object
          nullable: true
          description: "The viewer's record against them; null on your own profile"
          required: [wins, losses]
          additionalProperties: false
          properties:
            wins: { type: integer, minimum: 0 }
            losses: { type: integer, minimum: 0 }
        playsMost:
          type: array
          items:
            type: object
            required: [mode, games]
            additionalProperties: false
            properties:
              mode: { type: string }
              games: { type: integer, minimum: 0 }
        recent:
          type: array
          items:
            type: object
            required: [id, gameId, finishedAt, placement, players, others]
            additionalProperties: false
            properties:
              id: { type: string }
              gameId: { type: string }
              finishedAt: { type: string, format: date-time }
              placement: { type: integer, minimum: 1 }
              players: { type: integer, minimum: 1 }
              others: { type: array, items: { type: string }, description: 'The other seats, by name' }
        xp: { type: integer, minimum: 0, nullable: true, description: Yourself only }
        collection:
          type: object
          nullable: true
          description: Yourself only
          required: [unlocked, total]
          additionalProperties: false
          properties:
            unlocked: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
    ChallengeSet:
      type: object
      required: [resetsAt, items]
      additionalProperties: false
      properties:
        resetsAt:
          { type: string, format: date-time, description: 'When a new set comes: local midnight (daily), Monday 00:00 local (weekly)' }
        items:
          type: array
          items:
            type: object
            required: [id, slot, title, difficulty, target, progress, xp, completed, claimed, canReroll]
            additionalProperties: false
            properties:
              id: { type: string }
              slot: { type: integer, minimum: 1, maximum: 3 }
              title: { type: string }
              difficulty: { type: string, enum: [easy, medium, hard] }
              target: { type: integer, minimum: 1 }
              progress: { type: integer, minimum: 0, description: At most the target }
              xp: { type: integer, minimum: 0 }
              completed: { type: boolean, description: Done }
              claimed: { type: boolean, description: 'Paid: claimed, or settled after its period ended' }
              canReroll: { type: boolean }
    ChallengeClaim:
      type: object
      required: [challenges, xp, level]
      additionalProperties: false
      properties:
        challenges: { $ref: '#/components/schemas/Challenges' }
        xp: { type: integer, minimum: 0, description: Total XP after the claim }
        level: { type: integer, minimum: 1 }
    Challenges:
      type: object
      required: [daily, weekly]
      additionalProperties: false
      properties:
        daily: { $ref: '#/components/schemas/ChallengeSet' }
        weekly: { $ref: '#/components/schemas/ChallengeSet' }
    DayStreak:
      type: object
      description: The day streak, counted in your time zone (preferences.timeZone)
      required: [current, best, freezes, playedToday, bonus, days, nextMilestone, today]
      additionalProperties: false
      properties:
        current: { type: integer, minimum: 0, description: 'Days in a row, as it stands today (0: lost)' }
        best: { type: integer, minimum: 0 }
        freezes: { type: integer, minimum: 0, description: Banked freezes; one covers a single missed day }
        playedToday: { type: boolean, description: Today already counts }
        bonus: { type: integer, minimum: 0, description: "Today's first-game bonus (what it paid, or will pay)" }
        today: { type: string, format: date }
        days:
          type: array
          description: The last 7 days, oldest first, today last
          items:
            type: object
            required: [date, state]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              state: { type: string, enum: [played, frozen, missed, today] }
        nextMilestone:
          type: object
          nullable: true
          required: [days, xp]
          additionalProperties: false
          properties:
            days: { type: integer, minimum: 1 }
            xp: { type: integer, minimum: 0 }
    XpLine:
      type: object
      required: [kind, amount]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [dart, game, win, ranked, oneEighty, checkout, personalBest, daily, challenge, milestone]
        amount: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 0, description: 'Darts thrown, 180s hit, the streak day of a daily bonus' }
        title: { type: string, description: "A challenge's title" }
    GameXp:
      type: object
      required: [lines, total, xp]
      additionalProperties: false
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/XpLine' } }
        total: { type: integer, minimum: 0 }
        xp: { type: integer, minimum: 0, description: Your total XP now }
    NameAvailability:
      type: object
      required: [available]
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [taken, invalid] }
    CreatedSession:
      type: object
      required: [sessionId]
      additionalProperties: false
      properties:
        sessionId: { type: string }
    ActiveSessionError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
        sessionId: { type: string, description: "The user's running session (absent when the board is busy)" }
    LobbyRef:
      type: object
      required: [id, name, code]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, description: '6 characters; shown as K7Q4-MD' }
    LobbyPreview:
      type: object
      required: [id, name, hostName, peopleCount, faces, nextGame, boardNames]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        hostName: { type: string, nullable: true }
        peopleCount: { type: integer, minimum: 0 }
        faces: { type: array, items: { $ref: '#/components/schemas/LobbyFace' } }
        nextGame:
          type: object
          nullable: true
          required: [gameId, config]
          additionalProperties: false
          properties:
            gameId: { type: string }
            config: { type: object, additionalProperties: true }
        boardNames: { type: array, items: { type: string } }
    LobbyFace:
      type: object
      description: Someone in a lobby, for an avatar stack. guest means no account and not a bot.
      required: [userId, name, guest, avatar]
      additionalProperties: false
      properties:
        userId: { type: string, nullable: true, description: 'To fetch an uploaded avatar; null for a guest or bot.' }
        name: { type: string }
        guest: { type: boolean }
        avatar: { $ref: '#/components/schemas/Avatar' }
    UpdateLobbyRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 48 }
        throwOrder: { type: string, enum: [lobby, random, bulloff] }
        nextGame:
          type: object
          nullable: true
          required: [gameId, config]
          additionalProperties: false
          properties:
            gameId: { type: string, minLength: 1 }
            config: { type: object, additionalProperties: true }
        access: { type: string, enum: [friends, invite], description: 'Host: who can join without the code' }
        regenerateCode: { type: boolean }
    JoinLobbyRequest:
      type: object
      additionalProperties: false
      description: 'Without a code: only a friend of the host, while the lobby is open to friends.'
      properties:
        code: { type: string, minLength: 1, maxLength: 16 }
        atHostBoard:
          type: boolean
          description: "Joined by scanning the host's QR code: sit at the host's board, if it's online and free (else the joiner's usual board)."
    AddGuestRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '\S', maxLength: 32 }
        boardId:
          {
            type: string,
            nullable: true,
            minLength: 1,
            description: "Absent: the adder's board. null: Manual. Otherwise one of the adder's own boards. Ignored if bot is set.",
          }
        bot:
          type: object
          nullable: true
          required: [level]
          additionalProperties: false
          properties:
            level: { type: integer, minimum: 1, maximum: 10 }
          description: 'Add a bot instead of a guest: the server throws for this seat, at this difficulty.'
    UpdatePersonRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        boardId: { type: string, nullable: true, minLength: 1, description: 'One of your own boards, or null for Manual' }
        plays: { type: boolean, description: 'false: sits out the next game' }
        ready: { type: boolean }
        position: { type: integer, minimum: 0, description: 'Host: move to this place in the lobby order' }
        team: { type: string, enum: [A, B], description: 'Host: move them to this team' }
    StartLobbyRequest:
      type: object
      additionalProperties: false
      properties:
        force: { type: boolean, description: "Start even though people who play aren't ready" }
    CreateInviteRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId: { type: string, minLength: 1 }
    CreatedId:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string }
    LobbyConflict:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
        code:
          {
            type: string,
            enum:
              [
                in_lobby,
                not_ready,
                board_offline,
                board_busy,
                active_session,
                game_running,
                already_member,
                already_invited,
                game_unavailable,
              ],
          }
        lobbyId: { type: string, description: 'in_lobby: the lobby you are in; leave it first' }
        sessionId: { type: string, description: "game_running: the lobby's game. active_session: your own running game" }
        notReady:
          type: array
          description: "not_ready: who plays but isn't ready"
          items:
            type: object
            required: [personId, name]
            additionalProperties: false
            properties:
              personId: { type: string }
              name: { type: string }
        offlineBoards: { type: array, items: { type: string }, description: 'board_offline: the boards that are offline' }
    Invite:
      type: object
      required: [id, lobbyId, lobbyName, inviterUserId, inviterName, createdAt, hostName, peopleCount, faces, nextGame, boardNames]
      additionalProperties: false
      description: Same shape as PendingInvite in schema/lobby-ws-v1.json
      properties:
        id: { type: string }
        lobbyId: { type: string }
        lobbyName: { type: string }
        inviterUserId: { type: string, nullable: true }
        inviterName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        hostName: { type: string, nullable: true }
        peopleCount: { type: integer, minimum: 0 }
        faces: { type: array, items: { $ref: '#/components/schemas/LobbyFace' } }
        nextGame:
          type: object
          nullable: true
          required: [gameId, config]
          additionalProperties: false
          properties:
            gameId: { type: string }
            config: { type: object, additionalProperties: true }
        boardNames: { type: array, items: { type: string } }
    InviteList:
      type: object
      required: [invites]
      additionalProperties: false
      properties:
        invites: { type: array, items: { $ref: '#/components/schemas/Invite' } }
    VoicePackSummary:
      type: object
      required: [id, name, lang, clips, bytes, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, description: 'From the file name or link, e.g. "en-GB Arthur (Male)"' }
        lang: { type: string, nullable: true, description: 'Language tag from the name, e.g. en-GB' }
        clips: { type: integer, minimum: 0, description: Distinct audio files kept }
        bytes: { type: integer, minimum: 0, description: Their total size; counts against the user's limit }
        createdAt: { type: string, format: date-time }
    VoicePackImport:
      type: object
      description: A pack just imported, with how many sound files its source had
      required: [id, name, lang, clips, bytes, createdAt, total]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, description: 'From the file name or link, e.g. "en-GB Arthur (Male)"' }
        lang: { type: string, nullable: true, description: 'Language tag from the name, e.g. en-GB' }
        clips: { type: integer, minimum: 0, description: Distinct audio files kept }
        bytes: { type: integer, minimum: 0, description: Their total size; counts against the user's limit }
        createdAt: { type: string, format: date-time }
        total: { type: integer, minimum: 0, description: 'Sound files in the source, kept or not ("Kept 385 of 12,422 clips")' }
    VoicePackList:
      type: object
      required: [packs, usage]
      additionalProperties: false
      properties:
        packs: { type: array, items: { $ref: '#/components/schemas/VoicePackSummary' } }
        usage:
          type: object
          required: [bytes, limitBytes]
          additionalProperties: false
          properties:
            bytes: { type: integer, minimum: 0, description: "Every file of the user's packs at full size, shared with others or not" }
            limitBytes: { type: integer, minimum: 0, description: The user's limit; 0 means imports are turned off }
    VoicePackManifest:
      type: object
      required: [id, name, clips]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        clips:
          type: object
          description: Caller key (`180`, `gameshot`, `leg_2`, …) → its variants' clip hashes (fetch each from /api/voice-clips/{sha256})
          additionalProperties:
            type: array
            minItems: 1
            items: { type: string, pattern: '^[0-9a-f]{64}$' }

    MinigolfPt:
      type: array
      description: 'A point in course space, [x, y]: millimetres, x right, y down.'
      items: { type: number }
      minItems: 2
      maxItems: 2
    MinigolfHole:
      type: object
      description: "A hole's geometry (see backend/src/shared/minigolf/types.ts)."
      required: [id, name, par, outline, walls, bumpers, slopes, tee, cup]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        par: { type: integer, minimum: 1 }
        outline: { type: array, items: { $ref: '#/components/schemas/MinigolfPt' } }
        walls:
          type: array
          items:
            type: object
            required: [points]
            additionalProperties: false
            properties:
              points: { type: array, items: { $ref: '#/components/schemas/MinigolfPt' } }
              closed: { type: boolean }
              restitution: { type: number }
              thickness: { type: number, description: 'This wall only; the physics default (20 mm) otherwise' }
        bumpers:
          type: array
          items:
            type: object
            required: [at, r]
            additionalProperties: false
            properties:
              at: { $ref: '#/components/schemas/MinigolfPt' }
              r: { type: number }
              restitution: { type: number }
              kick: { type: number }
        slopes:
          type: array
          items:
            anyOf:
              - type: object
                required: [radial]
                additionalProperties: false
                properties:
                  radial:
                    type: object
                    required: [center, radius, strength]
                    additionalProperties: false
                    properties:
                      center: { $ref: '#/components/schemas/MinigolfPt' }
                      radius: { type: number }
                      strength: { type: number }
              - type: object
                required: [bump]
                additionalProperties: false
                properties:
                  bump:
                    type: object
                    required: [from, to, width, strength]
                    additionalProperties: false
                    properties:
                      from: { $ref: '#/components/schemas/MinigolfPt' }
                      to: { $ref: '#/components/schemas/MinigolfPt' }
                      width: { type: number }
                      strength: { type: number }
        terrain:
          type: array
          description: Shaped by height ($shared/minigolf/3d/ground.ts)
          items:
            type: object
            required: [mesa]
            additionalProperties: false
            properties:
              mesa:
                type: object
                required: [from, to, height, edges]
                additionalProperties: false
                properties:
                  from: { $ref: '#/components/schemas/MinigolfPt' }
                  to: { $ref: '#/components/schemas/MinigolfPt' }
                  height: { type: number }
                  edges: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        shape:
          type: object
          description: "The outline's editable source (corners, curved edges, circles); baked into `outline`."
          required: [corners, curves, circles]
          additionalProperties: false
          properties:
            corners: { type: array, items: { $ref: '#/components/schemas/MinigolfPt' } }
            curves:
              type: array
              description: One per edge from corners[i] to corners[i + 1] (wrapping); null is straight. The server refuses a shape with a different count.
              items: { anyOf: [{ $ref: '#/components/schemas/MinigolfCurve' }, { type: string, nullable: true, enum: [null] }] }
            circles:
              type: array
              items:
                type: object
                required: [center, r]
                additionalProperties: false
                properties:
                  center: { $ref: '#/components/schemas/MinigolfPt' }
                  r: { type: number, description: The server refuses r <= 0 on save }
        tee: { $ref: '#/components/schemas/MinigolfPt' }
        cup:
          type: object
          required: [at, r]
          additionalProperties: false
          properties:
            at: { $ref: '#/components/schemas/MinigolfPt' }
            r: { type: number }
    MinigolfCurve:
      type: object
      description: "A curved outline edge's two control points (a cubic Bézier alongside its corners)."
      required: [c1, c2]
      additionalProperties: false
      properties:
        c1: { $ref: '#/components/schemas/MinigolfPt' }
        c2: { $ref: '#/components/schemas/MinigolfPt' }
    MinigolfCourseContent:
      type: object
      required: [name, description, difficulty, holeIds]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        difficulty: { type: integer, enum: [1, 2, 3], description: '1 Easy, 2 Medium, 3 Hard' }
        holeIds: { type: array, items: { type: string }, description: Playing order }
    MinigolfCourse:
      type: object
      description: 'A course row; `draft` and `hasChanges` are left out for a viewer who may not see them (a player)'
      required: [id, ownerUserId, visibility, published, version, updatedAt, publishedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        ownerUserId: { type: string, nullable: true, description: null for an official course }
        visibility: { type: string, enum: [official] }
        published: { anyOf: [{ $ref: '#/components/schemas/MinigolfCourseContent' }, { type: string, nullable: true, enum: [null] }] }
        draft: { anyOf: [{ $ref: '#/components/schemas/MinigolfCourseContent' }, { type: string, nullable: true, enum: [null] }] }
        hasChanges: { type: boolean, description: 'Something to publish: its own draft, or a draft of one of its holes' }
        builtIn: { type: boolean, description: 'Shipped with the code (seeded): it can be unpublished, not deleted' }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
    MinigolfCourseList:
      type: object
      required: [courses]
      additionalProperties: false
      properties:
        courses: { type: array, items: { $ref: '#/components/schemas/MinigolfCourse' } }
    MinigolfCourseSave:
      type: object
      required: [version, content]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 0, description: The version this save started from }
        content: { $ref: '#/components/schemas/MinigolfCourseContent' }
    MinigolfHoleRow:
      type: object
      description: A hole row, as the hole library and the editor see it (admin only)
      required: [id, ownerUserId, published, draft, version, updatedAt, publishedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        ownerUserId: { type: string, nullable: true, description: null for an official hole }
        published: { anyOf: [{ $ref: '#/components/schemas/MinigolfHole' }, { type: string, nullable: true, enum: [null] }] }
        draft: { anyOf: [{ $ref: '#/components/schemas/MinigolfHole' }, { type: string, nullable: true, enum: [null] }] }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        usedBy: { type: integer, minimum: 0, description: 'Courses (draft or published) using it; only in the library list' }
    MinigolfHoleList:
      type: object
      required: [holes]
      additionalProperties: false
      properties:
        holes: { type: array, items: { $ref: '#/components/schemas/MinigolfHoleRow' } }
    MinigolfHoleCreate:
      type: object
      description: A brand new hole, or a copy of another one's current content
      oneOf:
        - type: object
          required: [hole]
          additionalProperties: false
          properties:
            hole: { $ref: '#/components/schemas/MinigolfHole' }
        - type: object
          required: [copyOf]
          additionalProperties: false
          properties:
            copyOf: { type: string, description: The id of the hole to copy }
    MinigolfHoleSave:
      type: object
      required: [version, hole]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 0, description: The version this save started from }
        hole: { $ref: '#/components/schemas/MinigolfHole' }
    MinigolfCheck:
      type: object
      description: A check the editor shows live and Publish enforces; errors block, warnings are advice
      required: [level, message]
      additionalProperties: false
      properties:
        level: { type: string, enum: [error, warning] }
        message: { type: string }
        element:
          type: object
          required: [kind, index]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [outline, edge, tee, cup, bumper, wall, slope, terrain, circle] }
            index: { type: integer, minimum: 0 }
    MinigolfPublishProblem:
      type: object
      required: [holeId, checks]
      additionalProperties: false
      properties:
        holeId: { type: string, description: "'' for a problem with the course itself (no holes)" }
        checks: { type: array, items: { $ref: '#/components/schemas/MinigolfCheck' } }
    MinigolfPublishRefusal:
      type: object
      required: [error, problems]
      additionalProperties: false
      properties:
        error: { type: string, enum: [invalid] }
        problems: { type: array, items: { $ref: '#/components/schemas/MinigolfPublishProblem' } }
