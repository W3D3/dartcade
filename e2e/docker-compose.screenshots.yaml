# Layered on docker-compose.e2e.yaml for the docs screenshots (screenshots.config.ts): its own
# project name and ports, so it runs beside the dev and e2e stacks, and the dev accounts
# (NODE_ENV=development seeds Admin, Luke, Phil, Michael, Gerwyn) with every flagged feature on.
name: dartcade-shots

services:
  backend:
    environment:
      NODE_ENV: development
      ADMIN_EMAILS: admin@dartcade.local
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5181
      FLAGS_ON: gamemode.minigolf.enabled,gamemode.p121.enabled,matchmaking.enabled,caller.autodartsImport
    ports: !override
      - '3021:3000'

  frontend:
    ports: !override
      - '5181:5173'
