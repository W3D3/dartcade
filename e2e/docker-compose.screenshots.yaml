# Layered on docker-compose.e2e.yaml for the docs screenshots (screenshots.config.ts): its own
# project name (COMPOSE_PROJECT_NAME overrides it) and ports (SHOTS_FRONTEND_PORT, SHOTS_BACKEND_PORT), so it runs beside the dev and e2e stacks, and the dev accounts
# (NODE_ENV=development seeds Admin, Luke, Phil, Michael, Gerwyn) with every flagged feature on.
name: dartcade-shots

services:
  backend:
    environment:
      NODE_ENV: development
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:${SHOTS_FRONTEND_PORT:-5181}
      FLAGS_ON: gamemode.minigolf.enabled,gamemode.p121.enabled,gamemode.cricket.enabled,matchmaking.enabled,caller.autodartsImport,progression.enabled,lights.enabled,coach.enabled,coach.live.enabled
    ports: !override
      - '${SHOTS_BACKEND_PORT:-3021}:3000'

  frontend:
    ports: !override
      - '${SHOTS_FRONTEND_PORT:-5181}:5173'
