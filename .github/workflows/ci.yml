name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dartcade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dartcade_test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
        working-directory: backend/frontend
      - run: npm run typecheck
        working-directory: backend/frontend
      - run: npm run lint
        working-directory: backend/frontend
      - run: npm test
        working-directory: backend/frontend

  test-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: go test ./...
        working-directory: bridge

  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: npm run lint:api
      - name: Generated files are up to date
        run: |
          npm run gen:api
          [ -z "$(git status --porcelain)" ] || { echo "::error::Run 'npm run gen:api' at the repo root and commit the result"; exit 1; }

  check-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dartcade_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Shipped migrations are unchanged; new ones are numbered after them
        run: scripts/check-migrations.sh origin/${{ github.base_ref }}
      - run: npm ci
        working-directory: backend
      - name: Upgrading an existing database gives the same schema as a fresh one
        run: |
          mkdir -p "$RUNNER_TEMP/base-migrations"
          git -C .. archive "origin/${{ github.base_ref }}" backend/src/db/migrations | tar -x -C "$RUNNER_TEMP/base-migrations" --strip-components=4
          npx tsx src/db/checkMigrations.ts
        working-directory: backend
        env:
          CHECK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dartcade_migrations
          BASE_MIGRATIONS_DIR: ${{ runner.temp }}/base-migrations
          SCHEMA_DIFF_OUT: ${{ runner.temp }}/schema-diff.md
      - name: Comment the schema changes on the PR
        # One comment per PR, edited on each run. A PR without schema changes gets no comment,
        # unless an earlier run left one (then it says so). Forks get a read-only token: skipped.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FILE: ${{ runner.temp }}/schema-diff.md
        run: |
          [ -f "$FILE" ] || exit 0
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- schema-diff -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$FILE" >/dev/null
          elif ! grep -q 'no changes in this PR' "$FILE"; then
            gh pr comment "$PR" --body-file "$FILE"
          fi

  test-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: e2e
      - name: Run e2e smoke tests
        run: npm test
        working-directory: e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
