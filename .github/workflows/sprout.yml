name: sprout

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  preview:
    uses: simpros/sprout/.github/workflows/preview.yml@396f3923e226bc198d0a31af9e26eea31f2b0a94 # v0.9.0
    with:
      sprout_version: v0.9.0
      app_context: backend
    secrets:
      SPROUT_URL: ${{ secrets.SPROUT_URL }}
      SPROUT_TOKEN: ${{ secrets.SPROUT_TOKEN }}
      SPROUT_APP_ENV: ${{ secrets.SPROUT_APP_ENV }}
