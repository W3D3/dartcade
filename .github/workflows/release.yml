name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuilds the images of a tag that already exists (e.g. after a failed image build)
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build the images of (e.g. v0.3.0)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The release and its notes: one line per merged PR since the last tag (cliff.toml)
  release-notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Write the notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --current --strip all
        env:
          OUTPUT: NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --notes-file NOTES.md --verify-tag

  release-bridge-binaries:
    # The binaries are attached to the release when the tag is pushed; a rebuild leaves them be
    if: github.event_name == 'push'
    needs: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: dartcade-bridge_linux_amd64
          - goos: linux
            goarch: arm64
            name: dartcade-bridge_linux_arm64
          - goos: darwin
            goarch: amd64
            name: dartcade-bridge_darwin_amd64
          - goos: darwin
            goarch: arm64
            name: dartcade-bridge_darwin_arm64
          - goos: windows
            goarch: amd64
            name: dartcade-bridge_windows_amd64.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build
        working-directory: bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags "-X main.version=${{ github.ref_name }}" -o ${{ matrix.name }} ./cmd/bridge
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: bridge/${{ matrix.name }}

  # SHA256SUMS of the binaries, signed: a bridge updating itself verifies both before it runs the
  # new binary (bridge/internal/update, which embeds the public key, release.pub)
  sign-bridge-binaries:
    if: github.event_name == 'push'
    needs: release-bridge-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write and sign the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An ed25519 private key (PEM), the pair of bridge/internal/update/release.pub
          SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The BRIDGE_SIGNING_KEY secret is not set, so bridges can't update themselves to $TAG (see DEVELOPMENT.md)"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'dartcade-bridge_*'
          sha256sum dartcade-bridge_* > SHA256SUMS
          printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl pkeyutl -sign -rawin -inkey key.pem -in SHA256SUMS -out SHA256SUMS.sig
          rm key.pem
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS SHA256SUMS.sig

  # Each image is built natively per architecture (arm64 on an ARM runner: QEMU crashed Node
  # with "Illegal instruction" and hung the job), pushed by digest, then joined into one tag
  build-image:
    strategy:
      fail-fast: false
      matrix:
        image: [bridge, backend]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: bridge
            name: dartcade-bridge
            context: bridge
          - image: backend
            name: dartcade
            context: backend
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      - name: Stamp the build
        # The tag's commit, not github.sha: a workflow_dispatch rebuild runs on the default branch
        run: |
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        # Registry names must be lowercase; the owner is W3D3
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          # BUILD_TIME only for the backend: the bridge's Dockerfile doesn't take it
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ env.COMMIT }}
            ${{ matrix.image == 'backend' && format('BUILD_TIME={0}', env.BUILD_TIME) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    needs: build-image
    strategy:
      matrix:
        include:
          - image: bridge
            name: dartcade-bridge
          - image: backend
            name: dartcade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        # Registry names must be lowercase; the owner is W3D3
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest
      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          # Word splitting is wanted: one -t per tag, one argument per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
