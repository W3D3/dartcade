name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuilds the images of a tag that already exists (e.g. after a failed image build)
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build the images of (e.g. v0.3.0)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The release and its notes: one line per merged PR since the last tag (cliff.toml)
  release-notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Write the notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --current --strip all
        env:
          OUTPUT: NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --notes-file NOTES.md --verify-tag

  release-bridge-binaries:
    # The binaries are attached to the release when the tag is pushed; a rebuild leaves them be
    if: github.event_name == 'push'
    needs: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: dartcade-bridge_linux_amd64
          - goos: linux
            goarch: arm64
            name: dartcade-bridge_linux_arm64
          - goos: darwin
            goarch: amd64
            name: dartcade-bridge_darwin_amd64
          - goos: darwin
            goarch: arm64
            name: dartcade-bridge_darwin_arm64
          - goos: windows
            goarch: amd64
            name: dartcade-bridge_windows_amd64.exe
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Build
        working-directory: bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags "-X main.version=${{ github.ref_name }}" -o ${{ matrix.name }} ./cmd/bridge
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/${{ matrix.name }}

  # Each image is built natively per architecture (arm64 on an ARM runner: QEMU crashed Node
  # with "Illegal instruction" and hung the job), pushed by digest, then joined into one tag
  build-image:
    strategy:
      fail-fast: false
      matrix:
        image: [bridge, backend]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: bridge
            name: dartcade-bridge
            context: bridge
          - image: backend
            name: dartcade
            context: backend
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    needs: build-image
    strategy:
      matrix:
        include:
          - image: bridge
            name: dartcade-bridge
          - image: backend
            name: dartcade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest
      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          # Word splitting is wanted: one -t per tag, one argument per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@sha256:%s ' *)
